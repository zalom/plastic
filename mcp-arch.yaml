# Enola snapshot config (intent 187).
#
# Enola discovers this file from the working directory of the `enola` process,
# not from the repo_path passed to generate_snapshot. Keep it at the repo root.
#
# `ignore` REPLACES Enola's built-in default glob list, it does not add to it.
# So the list below is Enola's own default set (v0.1.24) plus the one entry
# Plastic actually needs: `.claude/worktrees/**`.
#
# Why that entry matters: Plastic gives every code intent its own git worktree
# under .claude/worktrees/, and each one is a full copy of the repo. Without
# this line, a snapshot of the repo root indexes those copies too. Measured on
# the first run: 2307 of 3453 facts (66.8%) came from worktrees, and symbol
# lookups resolved to a disposable worktree copy instead of the real file.
ignore:
  - "vendor/**"
  - "node_modules/**"
  - ".git/**"
  - "**/*_test.go"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/spec/**/*_spec.rb"
  - "**/test/**/*_test.rb"
  - ".enola/**"
  - ".next/**"
  - "dist/**"
  - "**/build/**"
  - "out/**"
  - ".vercel/**"
  - ".turbo/**"
  - "coverage/**"
  - ".nuxt/**"
  - ".svelte-kit/**"
  - "**/__pycache__/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/site-packages/**"
  - "**/.tox/**"
  - "**/.nox/**"
  - "**/.eggs/**"
  - "**/.mypy_cache/**"
  - "**/.pytest_cache/**"
  - "**/.ruff_cache/**"
  - "**/Pods/**"
  - "**/.gradle/**"
  - "**/*.min.js"
  - "**/*.bundle.js"
  - ".claude/worktrees/**"
