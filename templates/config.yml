version: 3
project_roots:
  - ~/.plastic/projects
stale_threshold_days: 3
execution_mode: subagent-driven
hash_length: 6
hash_algorithm: sha256-base36
max_slug_words: 5
agent:
  type: claude-code
  parallel_mode: linear
architect:
  style:

# Per-agent model override (intent 116). Uncomment and set to a Claude Code
# alias (opus, sonnet, haiku) to override the shipped tier for one agent. With
# no entry, the shipped default applies and never resolves to Fable; naming
# Fable here is an explicit, sanctioned override, honored as written.
# agents:
#   models:
#     plastic-executor: sonnet
#     plastic-enforcer: opus

# Consultation agent and model instructions (intent 185). advisor.enabled and
# model_instructions.opus default to enabled; missing or unreadable counts as
# enabled (fail-open). Set at install time via --no-advisor /
# --no-opus-instructions / --advisor-model, or uncomment here directly.
# advisor:
#   enabled: false   # skip installing plastic-advisor; omit its pointer
#                     # from injected model instructions
#   model: opus       # which model runs plastic-advisor: opus or fable.
#                      # Resolved ahead of any agents.models.plastic-advisor
#                      # override, through the same install-time frontmatter
#                      # rewrite every agent override uses. Shipped default: fable.
# model_instructions:
#   opus: false   # skip injecting the Operating Manual into Opus sessions
