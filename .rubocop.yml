require:
  - standard

plugins:
  - rubocop-minitest

inherit_gem:
  standard: config/base.yml

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - "node_modules/**/*"
    - "coverage/**/*"
    - "tmp/**/*"

# Every one of this repository's 468 Ruby files opens with the same header, and
# the magic encoding comment is the first line of it. Standard reads the comment
# as dead weight, which it is on Ruby 3, but a cop that fires on every file in
# the repository reports nothing about a change.
Style/Encoding:
  Enabled: false

# Standard turns the Metrics cops off. They are on for the whole repository:
# a method or class that trips one is split, never excused.
Metrics/AbcSize:
  Enabled: true
Metrics/BlockNesting:
  Enabled: true
Metrics/ClassLength:
  Enabled: true
  CountAsOne: [array, hash]
Metrics/CyclomaticComplexity:
  Enabled: true
Metrics/MethodLength:
  Enabled: true
# A data table, such as the workflow registry, is one hash literal; its rows
# are data, not code, so a table counts as one line of the class or module.
Metrics/ModuleLength:
  Enabled: true
  CountAsOne: [array, hash]
Metrics/ParameterLists:
  Enabled: true
Metrics/PerceivedComplexity:
  Enabled: true

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: space
