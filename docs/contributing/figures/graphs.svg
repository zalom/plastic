<path class="flow" d="M 360 424.0 L 425 424.0 L 425 427.5 L 490 427.5" marker-end="url(#graphs-arrow)"/>
<text class="al" x="393" y="417" text-anchor="middle">prints</text>
<path class="flow" d="M 655.0 264 L 655.0 282 L 620.0 282 L 620.0 300" marker-end="url(#graphs-arrow)"/>
<text class="al" x="638" y="275" text-anchor="middle">rows</text>
<path class="flow" d="M 995.0 264 L 995.0 282 L 1010.0 282 L 1010.0 300" marker-end="url(#graphs-arrow)"/>
