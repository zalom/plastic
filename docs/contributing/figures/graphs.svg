<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" role="img" aria-labelledby="graphs-title graphs-desc" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="graphs-title">The three graphs and their databases</title>
  <desc id="graphs-desc">The work graph lives in work_graph.db. The knowledge graph and the retrieval graph both live in knowledge_graph.db. Graph::WorkGraph and Graph::RetrievalGraph read and write the rows, and Graph::Printer prints them as files.</desc>
  <defs><marker id="graphs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line, #6b7483)"/></marker></defs>
  <style>svg { --ink: #1f2530; --muted: #3f4754; --line: #6b7483; --paper: #e9e5dc; --card: #f4f1ea; --rule: #c9c3b6; --code: #0b5e55; --agent: #7d4405; --owner: #4a2a99; --owner-bg: #e4dcf5; --end: #23406f; --end-bg: #d9e2f0; }
@media (prefers-color-scheme: dark) { svg { --ink: #e8e6e1; --muted: #b4bac4; --line: #8a93a3; --paper: #1d2128; --card: #262b34; --rule: #3b424e; --code: #5fd0c0; --agent: #e0a24f; --owner: #b9a2ff; --owner-bg: #2f2750; --end: #8fb0e8; --end-bg: #1f2d45; } }
.background { fill: var(--paper, #e9e5dc); }
.box { fill: var(--card, #f4f1ea); stroke: var(--line, #6b7483); stroke-width: 1; }
.zone { fill: none; stroke: var(--line, #6b7483); stroke-width: 1.2; stroke-dasharray: 6 4; }
.t { fill: var(--ink, #1f2530); font-size: 14px; font-weight: 600; }
.s { fill: var(--muted, #3f4754); font-size: 11.5px; }
.al { fill: var(--ink, #1f2530); font-size: 11.5px; stroke: var(--paper, #e9e5dc); stroke-width: 4px; paint-order: stroke; }
.m { fill: var(--ink, #1f2530); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; }
.r { fill: var(--ink, #1f2530); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 11px; }
.flow { stroke: var(--line, #6b7483); stroke-width: 1.5; fill: none; }</style>
  <rect class="background" width="100%" height="100%"/>
<rect class="box" x="30" y="20" width="330" height="79" rx="8"/><rect x="30" y="20" width="6" height="79" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="46" y="44">Graph::WorkGraph</text><text class="s" x="46" y="61">[class]</text>
<text class="s" x="46" y="81">Opens the work graph.</text>
<rect class="box" x="490" y="20" width="330" height="94" rx="8"/><rect x="490" y="20" width="6" height="94" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="506" y="44">Graph::RetrievalGraph</text><text class="s" x="506" y="61">[class]</text>
<text class="s" x="506" y="81">Opens the knowledge and</text>
<text class="s" x="506" y="96">retrieval graphs.</text>
<rect class="box" x="30" y="170" width="330" height="94" rx="8"/><rect x="30" y="170" width="6" height="94" rx="3" fill="var(--agent, #7d4405)"/>
<text class="t" x="46" y="194">Work graph</text><text class="s" x="46" y="211">[graph]</text>
<text class="s" x="46" y="231">What is being built: intents, with</text>
<text class="s" x="46" y="246">their nodes and the edges between.</text>
<rect class="box" x="490" y="170" width="330" height="94" rx="8"/><rect x="490" y="170" width="6" height="94" rx="3" fill="var(--owner, #4a2a99)"/>
<text class="t" x="506" y="194">Knowledge graph</text><text class="s" x="506" y="211">[graph]</text>
<text class="s" x="506" y="231">What is known: documents,</text>
<text class="s" x="506" y="246">rulings and the links between.</text>
<rect class="box" x="850" y="170" width="290" height="94" rx="8"/><rect x="850" y="170" width="6" height="94" rx="3" fill="var(--end, #23406f)"/>
<text class="t" x="866" y="194">Retrieval graph</text><text class="s" x="866" y="211">[graph]</text>
<text class="s" x="866" y="231">What is found: the search index</text>
<text class="s" x="866" y="246">over the documents.</text>
<path class="box" d="M 30 309 L 30 358 A 165.0 9 0 0 0 360 358 L 360 309 Z"/>
<ellipse class="box" cx="195.0" cy="309" rx="165.0" ry="9" style="stroke: var(--code, #0b5e55)"/>
<text class="m" x="195.0" y="336" text-anchor="middle">work_graph.db</text>
<text class="s" x="195.0" y="354" text-anchor="middle">intents, nodes, edges</text>
<path class="box" d="M 490 309 L 490 358 A 325.0 9 0 0 0 1140 358 L 1140 309 Z"/>
<ellipse class="box" cx="815.0" cy="309" rx="325.0" ry="9" style="stroke: var(--code, #0b5e55)"/>
<text class="m" x="815.0" y="336" text-anchor="middle">knowledge_graph.db</text>
<text class="s" x="815.0" y="354" text-anchor="middle">documents, rulings, links, document_heads</text>
<rect class="box" x="30" y="400" width="330" height="48" rx="8"/><rect x="30" y="400" width="6" height="48" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="46" y="424">Graph::Printer</text>
<rect class="box" x="490" y="396" width="650" height="63" rx="8"/><rect x="490" y="396" width="6" height="63" rx="3" fill="var(--line, #6b7483)"/>
<text class="t" x="506" y="420">Files in the store folder</text>
<text class="s" x="506" y="441">spec.md, graph.json, savepoint.md, outcome.md</text>
<path class="flow" d="M 195.0 99 L 195.0 170" marker-end="url(#graphs-arrow)"/>
<text class="al" x="195" y="139" text-anchor="middle">opens</text>
<path class="flow" d="M 572.5 114 L 572.5 170" marker-end="url(#graphs-arrow)"/>
<text class="al" x="573" y="146" text-anchor="middle">opens</text>
<path class="flow" d="M 737.5 114 L 737.5 142 L 922.5 142 L 922.5 170" marker-end="url(#graphs-arrow)"/>
<path class="flow" d="M 195.0 264 L 195.0 300" marker-end="url(#graphs-arrow)"/>
