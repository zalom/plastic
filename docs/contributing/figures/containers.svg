<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" role="img" aria-labelledby="containers-title containers-desc" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="containers-title">What runs and where Plastic keeps its data</title>
  <desc id="containers-desc">The plastic program reads and writes four SQLite databases: local.db in the home, and work_graph.db, knowledge_graph.db and references.db in each store. Files are printed from the rows into the store folder, and a sync up reads hand edits back. Backups are copies of a store&#39;s databases.</desc>
  <defs><marker id="containers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line, #6b7483)"/></marker></defs>
  <style>svg { --ink: #1f2530; --muted: #3f4754; --line: #6b7483; --paper: #e9e5dc; --card: #f4f1ea; --rule: #c9c3b6; --code: #0b5e55; --agent: #7d4405; --owner: #4a2a99; --owner-bg: #e4dcf5; --end: #23406f; --end-bg: #d9e2f0; }
@media (prefers-color-scheme: dark) { svg { --ink: #e8e6e1; --muted: #b4bac4; --line: #8a93a3; --paper: #1d2128; --card: #262b34; --rule: #3b424e; --code: #5fd0c0; --agent: #e0a24f; --owner: #b9a2ff; --owner-bg: #2f2750; --end: #8fb0e8; --end-bg: #1f2d45; } }
.background { fill: var(--paper, #e9e5dc); }
.box { fill: var(--card, #f4f1ea); stroke: var(--line, #6b7483); stroke-width: 1; }
.zone { fill: none; stroke: var(--line, #6b7483); stroke-width: 1.2; stroke-dasharray: 6 4; }
.t { fill: var(--ink, #1f2530); font-size: 14px; font-weight: 600; }
.s { fill: var(--muted, #3f4754); font-size: 11.5px; }
.al { fill: var(--ink, #1f2530); font-size: 11.5px; stroke: var(--paper, #e9e5dc); stroke-width: 4px; paint-order: stroke; }
.m { fill: var(--ink, #1f2530); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; }
.r { fill: var(--ink, #1f2530); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 11px; }
.flow { stroke: var(--line, #6b7483); stroke-width: 1.5; fill: none; }</style>
  <rect class="background" width="100%" height="100%"/>
<rect class="zone" x="10" y="10" width="1140" height="170" rx="12"/><text class="s" x="24" y="30">Plastic home</text>
<rect class="zone" x="10" y="215" width="1140" height="375" rx="12"/><text class="s" x="24" y="235">A store: one for each project, under stores/</text>
<rect class="box" x="30" y="44" width="230" height="94" rx="8"/><rect x="30" y="44" width="6" height="94" rx="3" fill="var(--agent, #7d4405)"/>
<text class="t" x="46" y="68">PLASTIC.md</text><text class="s" x="46" y="85">[file]</text>
<text class="s" x="46" y="105">The always-on instructions</text>
<text class="s" x="46" y="120">the harness imports.</text>
<rect class="box" x="290" y="44" width="250" height="94" rx="8"/><rect x="290" y="44" width="6" height="94" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="306" y="68">bin/plastic</text><text class="s" x="306" y="85">[program]</text>
<text class="s" x="306" y="105">Ruby. One command, plastic,</text>
<text class="s" x="306" y="120">and the three hooks.</text>
<path class="box" d="M 580 59 L 580 123 A 120.0 9 0 0 0 820 123 L 820 59 Z"/>
<ellipse class="box" cx="700.0" cy="59" rx="120.0" ry="9" style="stroke: var(--code, #0b5e55)"/>
<text class="m" x="700.0" y="86" text-anchor="middle">local.db</text>
<text class="s" x="700.0" y="104" text-anchor="middle">routine_runs, sessions,</text>
<text class="s" x="700.0" y="119" text-anchor="middle">locks, backups</text>
<rect class="box" x="860" y="44" width="270" height="94" rx="8"/><rect x="860" y="44" width="6" height="94" rx="3" fill="var(--line, #6b7483)"/>
<text class="t" x="876" y="68">config.yml, projects.yml</text><text class="s" x="876" y="85">[files]</text>
<text class="s" x="876" y="105">Settings, and the list of</text>
<text class="s" x="876" y="120">projects: slug to repository.</text>
<path class="box" d="M 40 259 L 40 308 A 125.0 9 0 0 0 290 308 L 290 259 Z"/>
<ellipse class="box" cx="165.0" cy="259" rx="125.0" ry="9" style="stroke: var(--code, #0b5e55)"/>
<text class="m" x="165.0" y="286" text-anchor="middle">work_graph.db</text>
<text class="s" x="165.0" y="304" text-anchor="middle">intents, nodes, edges</text>
<path class="box" d="M 320 259 L 320 308 A 125.0 9 0 0 0 570 308 L 570 259 Z"/>
<ellipse class="box" cx="445.0" cy="259" rx="125.0" ry="9" style="stroke: var(--code, #0b5e55)"/>
<text class="m" x="445.0" y="286" text-anchor="middle">knowledge_graph.db</text>
<text class="s" x="445.0" y="304" text-anchor="middle">documents, rulings, links</text>
<path class="box" d="M 600 259 L 600 308 A 125.0 9 0 0 0 850 308 L 850 259 Z"/>
<ellipse class="box" cx="725.0" cy="259" rx="125.0" ry="9" style="stroke: var(--code, #0b5e55)"/>
<text class="m" x="725.0" y="286" text-anchor="middle">references.db</text>
<text class="s" x="725.0" y="304" text-anchor="middle">sqlar</text>
<rect class="box" x="880" y="244" width="250" height="94" rx="8"/><rect x="880" y="244" width="6" height="94" rx="3" fill="var(--line, #6b7483)"/>
<text class="t" x="896" y="268">backups/</text><text class="s" x="896" y="285">[folder]</text>
<text class="s" x="896" y="305">Copies of the three databases,</text>
<text class="s" x="896" y="320">one folder for each backup.</text>
<rect class="box" x="40" y="430" width="250" height="79" rx="8"/><rect x="40" y="430" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="56" y="454">store/index.json</text><text class="s" x="56" y="471">[file]</text>
<text class="s" x="56" y="491">Every intent, in order.</text>
<rect class="box" x="320" y="430" width="530" height="94" rx="8"/><rect x="320" y="430" width="6" height="94" rx="3" fill="var(--line, #6b7483)"/>
<text class="t" x="336" y="454">ID--slug/</text><text class="s" x="336" y="471">[intent folder]</text>
<text class="s" x="336" y="491">spec.md, graph.json, savepoint.md,</text>
<text class="s" x="336" y="506">outcome.md and context.json, printed from the rows.</text>
<path class="flow" d="M 540 91.0 L 580 91.0" marker-end="url(#containers-arrow)"/>
<text class="al" x="560" y="84" text-anchor="middle">rows</text>
<path class="flow" d="M 340.0 138 L 340.0 194 L 165.0 194 L 165.0 250" marker-end="url(#containers-arrow)"/>
<text class="al" x="253" y="187" text-anchor="middle">reads and writes rows</text>
<path class="flow" d="M 415.0 138 L 415.0 194 L 445.0 194 L 445.0 250" marker-end="url(#containers-arrow)"/>
<path class="flow" d="M 490.0 138 L 490.0 194 L 725.0 194 L 725.0 250" marker-end="url(#containers-arrow)"/>
<path class="flow" d="M 165.0 317 L 165.0 430" marker-end="url(#containers-arrow)"/>
<text class="al" x="165" y="378" text-anchor="middle">printed</text>
<path class="flow" d="M 445.0 317 L 445.0 373 L 426.0 373 L 426.0 430" marker-end="url(#containers-arrow)"/>
<text class="al" x="426" y="406" text-anchor="middle">printed from the rows;</text>
<text class="al" x="426" y="419" text-anchor="middle">sync up reads edits back</text>
</svg>
