<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 955" role="img" aria-labelledby="components-title components-desc" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="components-title">The components of the plastic kernel</title>
  <desc id="components-desc">The command line finds a row in CLI::TABLE and builds a Routine. The Routine runs the workflow chain through Routine::Traversal, which finds each workflow in Workflows::REGISTRY, and it opens the Graph. Graph::WorkGraph writes every database through Graph::Work::Writers, Graph::RetrievalGraph reads every database, and Graph::Printer prints files.</desc>
  <defs><marker id="components-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line, #6b7483)"/></marker></defs>
  <style>svg { --ink: #1f2530; --muted: #3f4754; --line: #6b7483; --paper: #e9e5dc; --card: #f4f1ea; --rule: #c9c3b6; --code: #0b5e55; --agent: #7d4405; --owner: #4a2a99; --owner-bg: #e4dcf5; --end: #23406f; --end-bg: #d9e2f0; }
@media (prefers-color-scheme: dark) { svg { --ink: #e8e6e1; --muted: #b4bac4; --line: #8a93a3; --paper: #1d2128; --card: #262b34; --rule: #3b424e; --code: #5fd0c0; --agent: #e0a24f; --owner: #b9a2ff; --owner-bg: #2f2750; --end: #8fb0e8; --end-bg: #1f2d45; } }
.background { fill: var(--paper, #e9e5dc); }
.box { fill: var(--card, #f4f1ea); stroke: var(--line, #6b7483); stroke-width: 1; }
.zone { fill: none; stroke: var(--line, #6b7483); stroke-width: 1.2; stroke-dasharray: 6 4; }
.t { fill: var(--ink, #1f2530); font-size: 14px; font-weight: 600; }
.s { fill: var(--muted, #3f4754); font-size: 11.5px; }
.al { fill: var(--ink, #1f2530); font-size: 11.5px; stroke: var(--paper, #e9e5dc); stroke-width: 4px; paint-order: stroke; }
.m { fill: var(--ink, #1f2530); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; }
.r { fill: var(--ink, #1f2530); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 11px; }
.flow { stroke: var(--line, #6b7483); stroke-width: 1.5; fill: none; }</style>
  <rect class="background" width="100%" height="100%"/>
<rect class="zone" x="10" y="10" width="1220" height="235" rx="12"/><text class="s" x="24" y="30">Commands: one call in, one report out</text>
<rect class="zone" x="190" y="285" width="840" height="240" rx="12"/><text class="s" x="204" y="305">Workflows</text>
<rect class="zone" x="10" y="565" width="1220" height="376" rx="12"/><text class="s" x="24" y="585">Graph module</text>
<rect class="box" x="30" y="44" width="260" height="79" rx="8"/><rect x="30" y="44" width="6" height="79" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="46" y="68">Routine</text><text class="s" x="46" y="85">[class]</text>
<text class="s" x="46" y="105">Runs one command to a report.</text>
<rect class="box" x="390" y="44" width="230" height="79" rx="8"/><rect x="390" y="44" width="6" height="79" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="406" y="68">CLI</text><text class="s" x="406" y="85">[class]</text>
<text class="s" x="406" y="105">Reads the words.</text>
<rect class="box" x="720" y="44" width="230" height="79" rx="8"/><rect x="720" y="44" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="736" y="68">CLI::TABLE</text><text class="s" x="736" y="85">[constant]</text>
<text class="s" x="736" y="105">One row for each command.</text>
<rect class="box" x="390" y="150" width="230" height="79" rx="8"/><rect x="390" y="150" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="406" y="174">CLI::Declarations</text><text class="s" x="406" y="191">[module]</text>
<text class="s" x="406" y="211">Options a command declares.</text>
<rect class="box" x="720" y="150" width="230" height="79" rx="8"/><rect x="720" y="150" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="736" y="174">CLI::Scope</text><text class="s" x="736" y="191">[class]</text>
<text class="s" x="736" y="211">Which project and store.</text>
<rect class="box" x="1000" y="150" width="210" height="79" rx="8"/><rect x="1000" y="150" width="6" height="79" rx="3" fill="var(--agent, #7d4405)"/>
<text class="m" x="1016" y="174">Hook</text><text class="s" x="1016" y="191">[class]</text>
<text class="s" x="1016" y="211">Answers the hook events.</text>
<rect class="box" x="205" y="317" width="230" height="79" rx="8"/><rect x="205" y="317" width="6" height="79" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="221" y="341">Routine::Traversal</text><text class="s" x="221" y="358">[class]</text>
<text class="s" x="221" y="378">Walks the chain of workflows.</text>
<rect class="box" x="495" y="317" width="230" height="79" rx="8"/><rect x="495" y="317" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="511" y="341">Workflows::REGISTRY</text><text class="s" x="511" y="358">[constant]</text>
<text class="s" x="511" y="378">Every workflow by name.</text>
<rect class="box" x="495" y="430" width="230" height="79" rx="8"/><rect x="495" y="430" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="511" y="454">CodeWorkflow</text><text class="s" x="511" y="471">[class]</text>
<text class="s" x="511" y="491">Ruby steps, in order.</text>
<rect class="box" x="785" y="430" width="230" height="79" rx="8"/><rect x="785" y="430" width="6" height="79" rx="3" fill="var(--agent, #7d4405)"/>
<text class="m" x="801" y="454">AgentWorkflow</text><text class="s" x="801" y="471">[class]</text>
<text class="s" x="801" y="491">Steps in words for the agent.</text>
<rect class="box" x="30" y="601" width="770" height="79" rx="8"/><rect x="30" y="601" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="46" y="625">Graph::WorkGraph</text><text class="s" x="46" y="642">[class]</text>
<text class="s" x="46" y="662">The write side of every database.</text>
<rect class="box" x="880" y="601" width="330" height="79" rx="8"/><rect x="880" y="601" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="896" y="625">Graph::Work::Writers</text><text class="s" x="896" y="642">[class]</text>
<text class="s" x="896" y="662">Does the writes for the work graph.</text>
<path class="box" d="M 30 744 L 30 778 A 85.0 9 0 0 0 200 778 L 200 744 Z"/>
<ellipse class="box" cx="115.0" cy="744" rx="85.0" ry="9" style="stroke: var(--code, #0b5e55)"/>
<text class="m" x="115.0" y="771" text-anchor="middle">local.db</text>
<path class="box" d="M 230 744 L 230 778 A 85.0 9 0 0 0 400 778 L 400 744 Z"/>
<ellipse class="box" cx="315.0" cy="744" rx="85.0" ry="9" style="stroke: var(--code, #0b5e55)"/>
<text class="m" x="315.0" y="771" text-anchor="middle">work_graph.db</text>
<path class="box" d="M 430 744 L 430 778 A 85.0 9 0 0 0 600 778 L 600 744 Z"/>
<ellipse class="box" cx="515.0" cy="744" rx="85.0" ry="9" style="stroke: var(--code, #0b5e55)"/>
<text class="m" x="515.0" y="771" text-anchor="middle">knowledge_graph.db</text>
<path class="box" d="M 630 744 L 630 778 A 85.0 9 0 0 0 800 778 L 800 744 Z"/>
<ellipse class="box" cx="715.0" cy="744" rx="85.0" ry="9" style="stroke: var(--code, #0b5e55)"/>
<text class="m" x="715.0" y="771" text-anchor="middle">references.db</text>
<rect class="box" x="880" y="722" width="330" height="79" rx="8"/><rect x="880" y="722" width="6" height="79" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="896" y="746">Graph::Database</text><text class="s" x="896" y="763">[class]</text>
<text class="s" x="896" y="783">One SQLite file, one transaction a write.</text>
<rect class="box" x="30" y="842" width="770" height="79" rx="8"/><rect x="30" y="842" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="46" y="866">Graph::RetrievalGraph</text><text class="s" x="46" y="883">[class]</text>
<text class="s" x="46" y="903">The read side of every database. It writes nothing.</text>
<rect class="box" x="880" y="842" width="330" height="79" rx="8"/><rect x="880" y="842" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="896" y="866">Graph::Printer</text><text class="s" x="896" y="883">[class]</text>
<text class="s" x="896" y="903">Prints the rows as files.</text>
<path class="flow" d="M 620 83.5 L 720 83.5" marker-end="url(#components-arrow)"/>
<text class="al" x="670" y="77" text-anchor="middle">finds the row</text>
