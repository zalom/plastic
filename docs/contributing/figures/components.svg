<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" role="img" aria-labelledby="components-title components-desc" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="components-title">The components of the plastic kernel</title>
  <desc id="components-desc">The command line finds a command in CLI::TABLE and builds a Routine. The Routine opens the Graph, runs the workflow chain through Routine::Traversal and reports one of four end values. Commands, workflows and graphs are separate groups of classes.</desc>
  <defs><marker id="components-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line, #6b7483)"/></marker></defs>
  <style>svg { --ink: #1f2530; --muted: #3f4754; --line: #6b7483; --paper: #e9e5dc; --card: #f4f1ea; --rule: #c9c3b6; --code: #0b5e55; --agent: #7d4405; --owner: #4a2a99; --owner-bg: #e4dcf5; --end: #23406f; --end-bg: #d9e2f0; }
@media (prefers-color-scheme: dark) { svg { --ink: #e8e6e1; --muted: #b4bac4; --line: #8a93a3; --paper: #1d2128; --card: #262b34; --rule: #3b424e; --code: #5fd0c0; --agent: #e0a24f; --owner: #b9a2ff; --owner-bg: #2f2750; --end: #8fb0e8; --end-bg: #1f2d45; } }
.background { fill: var(--paper, #e9e5dc); }
.box { fill: var(--card, #f4f1ea); stroke: var(--line, #6b7483); stroke-width: 1; }
.zone { fill: none; stroke: var(--line, #6b7483); stroke-width: 1.2; stroke-dasharray: 6 4; }
.t { fill: var(--ink, #1f2530); font-size: 14px; font-weight: 600; }
.s { fill: var(--muted, #3f4754); font-size: 11.5px; }
.al { fill: var(--ink, #1f2530); font-size: 11.5px; stroke: var(--paper, #e9e5dc); stroke-width: 4px; paint-order: stroke; }
.m { fill: var(--ink, #1f2530); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; }
.r { fill: var(--ink, #1f2530); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 11px; }
.flow { stroke: var(--line, #6b7483); stroke-width: 1.5; fill: none; }</style>
  <rect class="background" width="100%" height="100%"/>
<rect class="zone" x="10" y="10" width="1220" height="150" rx="12"/><text class="s" x="24" y="30">Dispatch: one command in, one report out</text>
<rect class="zone" x="10" y="190" width="600" height="190" rx="12"/><text class="s" x="24" y="210">Commands</text>
<rect class="zone" x="640" y="190" width="590" height="190" rx="12"/><text class="s" x="654" y="210">Workflows</text>
<rect class="zone" x="10" y="410" width="1220" height="215" rx="12"/><text class="s" x="24" y="430">Graphs</text>
<rect class="box" x="30" y="44" width="270" height="79" rx="8"/><rect x="30" y="44" width="6" height="79" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="46" y="68">CLI</text><text class="s" x="46" y="85">[class]</text>
<text class="s" x="46" y="105">Reads the words, finds the row.</text>
<rect class="box" x="330" y="44" width="270" height="79" rx="8"/><rect x="330" y="44" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="346" y="68">CLI::TABLE</text><text class="s" x="346" y="85">[constant]</text>
<text class="s" x="346" y="105">One row for each command.</text>
<rect class="box" x="630" y="44" width="270" height="79" rx="8"/><rect x="630" y="44" width="6" height="79" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="646" y="68">Routine</text><text class="s" x="646" y="85">[class]</text>
<text class="s" x="646" y="105">Runs one command to a report.</text>
<rect class="box" x="930" y="44" width="270" height="79" rx="8"/><rect x="930" y="44" width="6" height="79" rx="3" fill="var(--agent, #7d4405)"/>
<text class="m" x="946" y="68">Hook</text><text class="s" x="946" y="85">[class]</text>
<text class="s" x="946" y="105">Answers the three hook events.</text>
<rect class="box" x="30" y="222" width="270" height="79" rx="8"/><rect x="30" y="222" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="46" y="246">CLI::Declarations</text><text class="s" x="46" y="263">[module]</text>
<text class="s" x="46" y="283">Options a command declares.</text>
<rect class="box" x="330" y="222" width="260" height="79" rx="8"/><rect x="330" y="222" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="346" y="246">CLI::Scope</text><text class="s" x="346" y="263">[class]</text>
<text class="s" x="346" y="283">Which project and store.</text>
<rect class="box" x="660" y="222" width="270" height="79" rx="8"/><rect x="660" y="222" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="676" y="246">Workflows::REGISTRY</text><text class="s" x="676" y="263">[constant]</text>
<text class="s" x="676" y="283">Every workflow by name.</text>
<rect class="box" x="950" y="222" width="260" height="79" rx="8"/><rect x="950" y="222" width="6" height="79" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="966" y="246">Routine::Traversal</text><text class="s" x="966" y="263">[class]</text>
<text class="s" x="966" y="283">Walks the chain of workflows.</text>
<rect class="box" x="30" y="444" width="270" height="79" rx="8"/><rect x="30" y="444" width="6" height="79" rx="3" fill="var(--code, #0b5e55)"/>
<text class="m" x="46" y="468">Graph</text><text class="s" x="46" y="485">[module]</text>
<text class="s" x="46" y="505">Opens the databases.</text>
<rect class="box" x="330" y="444" width="270" height="79" rx="8"/><rect x="330" y="444" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="346" y="468">Graph::WorkGraph</text><text class="s" x="346" y="485">[class]</text>
<text class="s" x="346" y="505">Intents, nodes and edges.</text>
<rect class="box" x="630" y="444" width="270" height="79" rx="8"/><rect x="630" y="444" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="646" y="468">Graph::RetrievalGraph</text><text class="s" x="646" y="485">[class]</text>
<text class="s" x="646" y="505">Documents, rulings, links.</text>
<rect class="box" x="930" y="444" width="270" height="79" rx="8"/><rect x="930" y="444" width="6" height="79" rx="3" fill="var(--line, #6b7483)"/>
<text class="m" x="946" y="468">Graph::Printer</text><text class="s" x="946" y="485">[class]</text>
<text class="s" x="946" y="505">Prints the rows as files.</text>
<path class="flow" d="M 300 83.5 L 330 83.5" marker-end="url(#components-arrow)"/>
<text class="al" x="315" y="77" text-anchor="middle">finds</text>
<path class="flow" d="M 600 83.5 L 630 83.5" marker-end="url(#components-arrow)"/>
<text class="al" x="615" y="77" text-anchor="middle">builds</text>
<path class="flow" d="M 765.0 123 L 765.0 172 L 1028.0 172 L 1028.0 222" marker-end="url(#components-arrow)"/>
<text class="al" x="897" y="165" text-anchor="middle">runs</text>
<path class="flow" d="M 950 261.5 L 930 261.5" marker-end="url(#components-arrow)"/>
<text class="al" x="940" y="255" text-anchor="middle">looks up</text>
<path class="flow" d="M 684.0 123 L 684.0 283 L 165.0 283 L 165.0 444" marker-end="url(#components-arrow)"/>
<text class="al" x="425" y="276" text-anchor="middle">opens</text>
</svg>
