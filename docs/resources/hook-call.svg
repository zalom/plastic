<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="One call of a hook command">
<style>text { font: 14px sans-serif; fill: #1f2328; } .title { font-weight: 700; } .note { fill: #57606a; text-anchor: end; }</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
<rect width="960" height="300" fill="#ffffff"/>
<rect x="20" y="20" width="920" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
<text x="34" y="45" class="title">The harness sends an event</text>
<text x="926" y="45" class="note">JSON on stdin</text>
<rect x="56" y="76" width="884" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
<text x="70" y="101" class="title">Read the event</text>
<text x="926" y="101" class="note">empty input is an empty event</text>
<rect x="56" y="132" width="884" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
<text x="70" y="157" class="title">Respond to the event</text>
<text x="926" y="157" class="note">the subclass returns text, or nil</text>
<rect x="56" y="188" width="884" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
<text x="70" y="213" class="title">Print the text</text>
<text x="926" y="213" class="note">on stdout, only when there is text</text>
<rect x="20" y="244" width="920" height="40" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
<text x="34" y="269" class="title">Exit 0</text>
<text x="926" y="269" class="note">on any error: one line on stderr, then exit 0 all the same</text>
<polyline points="44,60 44,74" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
<polyline points="80,116 80,130" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
<polyline points="80,172 80,186" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
<polyline points="44,228 44,242" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
</svg>