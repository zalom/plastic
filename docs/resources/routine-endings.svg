<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 390" role="img" aria-label="A routine walks a chain of workflows and ends in one of four values">
<style>text { font: 14px sans-serif; fill: #1f2328; text-anchor: middle; } rect + text { font-weight: 700; }</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
<rect width="990" height="390" fill="#ffffff"/>
<rect x="20" y="30" width="200" height="90" rx="6" fill="none" stroke="#57606a" stroke-width="2"/>
<text x="120" y="60">Code workflow</text>
<text x="120" y="82">gates, reads and steps</text>
<text x="120" y="104">in order</text>
<rect x="270" y="30" width="200" height="90" rx="6" fill="none" stroke="#57606a" stroke-width="2"/>
<text x="370" y="60">Code workflow</text>
<text x="370" y="82">its outcome picks</text>
<text x="370" y="104">the next edge</text>
<rect x="520" y="30" width="200" height="90" rx="6" fill="none" stroke="#57606a" stroke-width="2"/>
<text x="620" y="60">Agent workflow</text>
<text x="620" y="82">steps in plain words</text>
<text x="620" y="104">for the agent</text>
<rect x="770" y="30" width="200" height="90" rx="6" fill="none" stroke="#57606a" stroke-width="2"/>
<text x="870" y="60">End of chain</text>
<text x="870" y="82">the edge reaches</text>
<text x="870" y="104">:noop</text>
<rect x="20" y="220" width="200" height="90" rx="6" fill="none" stroke="#9a6700" stroke-width="2"/>
<text x="120" y="250">Refused, exit 3</text>
<text x="120" y="272">a gate stops the call</text>
<text x="120" y="294">as a refusal</text>
<rect x="270" y="220" width="200" height="90" rx="6" fill="none" stroke="#cf222e" stroke-width="2"/>
<text x="370" y="250">Failed, exit 1</text>
<text x="370" y="272">a step breaks, or a gate</text>
<text x="370" y="294">stops the call as a failure</text>
<rect x="520" y="220" width="200" height="90" rx="6" fill="none" stroke="#0969da" stroke-width="2"/>
<text x="620" y="250">HandedOff, exit 0</text>
<text x="620" y="272">steps are left; exit 1</text>
<text x="620" y="294">with stops: :failure</text>
<rect x="770" y="220" width="200" height="90" rx="6" fill="none" stroke="#1a7f37" stroke-width="2"/>
<text x="870" y="250">Finished, exit 0</text>
<text x="870" y="272">prints next: and</text>
<text x="870" y="294">because:</text>
<polyline points="220,75 268,75" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
<polyline points="470,75 518,75" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
<polyline points="720,75 768,75" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
<polyline points="120,120 120,218" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
<polyline points="370,120 370,218" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
<polyline points="620,120 620,218" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
<polyline points="870,120 870,218" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="20" y="340" width="950" height="36" rx="6" fill="none" stroke="#57606a" stroke-dasharray="5 4"/>
<text x="495" y="363" style="font-weight: 400">A tool that writes saves its routine run row in work_graph.db after each workflow. The ending closes the row.</text>
</svg>
