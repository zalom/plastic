<text x="660" y="303" class="tag tag-muted" text-anchor="start">READ</text>
<text x="695.6" y="303" class="tm" text-anchor="start">runs on every call</text>
<rect x="652" y="326" width="272" height="22" rx="6" class="stop-failure"/>
<text x="660" y="341" class="tag tag-failure" text-anchor="start">GATE</text>
<text x="695.6" y="341" class="tm" text-anchor="start">false: exit 1, the agent fixes it</text>
<rect x="652" y="383" width="272" height="22" rx="6" class="card"/>
<text x="660" y="398" class="tag tag-muted" text-anchor="start">READ</text>
<text x="695.6" y="398" class="tm" text-anchor="start">runs on every call</text>
<rect x="652" y="421" width="272" height="22" rx="6" class="lane-code"/>
<text x="660" y="436" class="tag tag-code" text-anchor="start">STEP</text>
<text x="695.6" y="436" class="tm" text-anchor="start">runs until done: holds</text>
<rect x="652" y="478" width="272" height="22" rx="6" class="card"/>
<text x="660" y="493" class="tag tag-muted" text-anchor="start">READ</text>
<text x="695.6" y="493" class="tm" text-anchor="start">runs on every call</text>
<rect x="652" y="516" width="272" height="22" rx="6" class="end"/>
<text x="660" y="531" class="tag tag-end" text-anchor="start">OUTCOME</text>
<text x="714.8" y="531" class="tm" text-anchor="start">when its if: holds</text>
