.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<rect x="16" y="16" width="616" height="622" rx="6" class="codebox"/>
<text x="44" y="36" class="cx-n" text-anchor="end">9</text>
<text x="54.0" y="36" class="cx"><tspan class="cx-k">class</tspan> <tspan class="cx-t">ReviseIntent</tspan> &lt; <tspan class="cx-t">CodeWorkflow</tspan></text>
<text x="54" y="55" class="cx-n" text-anchor="start">⋯ other code</text>
<text x="44" y="74" class="cx-n" text-anchor="end">14</text>
<text x="68.5" y="74" class="cx"><tspan class="cx-w">sets</tspan> <tspan class="cx-y">:intent</tspan>, <tspan class="cx-y">:status</tspan>, <tspan class="cx-y">:change</tspan>, <tspan class="cx-y">:problem</tspan>, <tspan class="cx-y">:old_reference</tspan>, <tspan class="cx-y">:new_reference</tspan></text>
<text x="44" y="93" class="cx-n" text-anchor="end">15</text>
<text x="54.0" y="93" class="cx"></text>
<text x="44" y="112" class="cx-n" text-anchor="end">16</text>
<text x="68.5" y="112" class="cx"><tspan class="cx-w">read</tspan> <tspan class="cx-s">&quot;find the intent&quot;</tspan> <tspan class="cx-k">do</tspan> … <tspan class="cx-k">end</tspan></text>
<text x="44" y="131" class="cx-n" text-anchor="end">20</text>
<text x="54.0" y="131" class="cx"></text>
<text x="44" y="150" class="cx-n" text-anchor="end">21</text>
<text x="68.5" y="150" class="cx"><tspan class="cx-w">gate</tspan> <tspan class="cx-s">&quot;no intent %{intent_id} in this store&quot;</tspan>, <tspan class="cx-y">stops:</tspan> <tspan class="cx-y">:failure</tspan>,</text>
<text x="83.0" y="169" class="cx"><tspan class="cx-y">pass:</tspan> <tspan class="cx-k">-&gt;</tspan>(context) { !context.intent.<tspan class="cx-k">nil</tspan>? }</text>
<text x="44" y="188" class="cx-n" text-anchor="end">22</text>
<text x="54.0" y="188" class="cx"></text>
<text x="44" y="207" class="cx-n" text-anchor="end">23</text>
<text x="68.5" y="207" class="cx"><tspan class="cx-w">gate</tspan> <tspan class="cx-s">&quot;intent %{intent_id} is %{status}; a closed intent keeps its What an…&quot;</tspan>,</text>
<text x="83.0" y="226" class="cx"><tspan class="cx-y">stops:</tspan> <tspan class="cx-y">:failure</tspan>, <tspan class="cx-y">offers:</tspan> <tspan class="cx-s">&quot;plastic next&quot;</tspan>,</text>
<text x="83.0" y="245" class="cx"><tspan class="cx-y">because:</tspan> <tspan class="cx-s">&quot;a closed intent keeps its What and Why; pick other work&quot;</tspan>,</text>
<text x="83.0" y="264" class="cx"><tspan class="cx-y">pass:</tspan> <tspan class="cx-k">-&gt;</tspan>(context) { !<tspan class="cx-t">CLOSED</tspan>.include?(context.status) }</text>
<text x="44" y="283" class="cx-n" text-anchor="end">26</text>
<text x="54.0" y="283" class="cx"></text>
<text x="44" y="302" class="cx-n" text-anchor="end">27</text>
<text x="68.5" y="302" class="cx"><tspan class="cx-w">read</tspan> <tspan class="cx-s">&quot;check the change&quot;</tspan> <tspan class="cx-k">do</tspan> … <tspan class="cx-k">end</tspan></text>
<text x="44" y="321" class="cx-n" text-anchor="end">31</text>
<text x="54.0" y="321" class="cx"></text>
<text x="44" y="340" class="cx-n" text-anchor="end">32</text>
<text x="68.5" y="340" class="cx"><tspan class="cx-w">gate</tspan> <tspan class="cx-s">&quot;%{problem}&quot;</tspan>, <tspan class="cx-y">stops:</tspan> <tspan class="cx-y">:failure</tspan>,</text>
<text x="83.0" y="359" class="cx"><tspan class="cx-y">pass:</tspan> <tspan class="cx-k">-&gt;</tspan>(context) { context.problem.<tspan class="cx-k">nil</tspan>? }</text>
<text x="44" y="378" class="cx-n" text-anchor="end">33</text>
<text x="54.0" y="378" class="cx"></text>
<text x="44" y="397" class="cx-n" text-anchor="end">34</text>
<text x="68.5" y="397" class="cx"><tspan class="cx-w">read</tspan> <tspan class="cx-s">&quot;show the change&quot;</tspan> <tspan class="cx-k">do</tspan> … <tspan class="cx-k">end</tspan></text>
<text x="44" y="416" class="cx-n" text-anchor="end">40</text>
<text x="54.0" y="416" class="cx"></text>
<text x="44" y="435" class="cx-n" text-anchor="end">41</text>
<text x="68.5" y="435" class="cx"><tspan class="cx-w">step</tspan> <tspan class="cx-s">&quot;write the revision&quot;</tspan>,</text>
<text x="83.0" y="454" class="cx"><tspan class="cx-y">done:</tspan> <tspan class="cx-k">-&gt;</tspan>(context) { … } <tspan class="cx-k">do</tspan> … <tspan class="cx-k">end</tspan></text>
<text x="44" y="473" class="cx-n" text-anchor="end">44</text>
<text x="54.0" y="473" class="cx"></text>
<text x="44" y="492" class="cx-n" text-anchor="end">45</text>
<text x="68.5" y="492" class="cx"><tspan class="cx-w">read</tspan> <tspan class="cx-s">&quot;say what was written&quot;</tspan> <tspan class="cx-k">do</tspan> … <tspan class="cx-k">end</tspan></text>
<text x="44" y="511" class="cx-n" text-anchor="end">49</text>
<text x="54.0" y="511" class="cx"></text>
<text x="44" y="530" class="cx-n" text-anchor="end">50</text>
<text x="68.5" y="530" class="cx"><tspan class="cx-w">outcome</tspan> <tspan class="cx-y">:previewed</tspan>, <tspan class="cx-y">if:</tspan> <tspan class="cx-k">-&gt;</tspan>(context) { context.dry_run },</text>
<text x="83.0" y="549" class="cx"><tspan class="cx-y">offers:</tspan> <tspan class="cx-s">&quot;%{original_command}&quot;</tspan>, <tspan class="cx-y">because:</tspan> <tspan class="cx-s">&quot;the dry run wrote nothing&quot;</tspan></text>
<text x="44" y="568" class="cx-n" text-anchor="end">52</text>
<text x="68.5" y="568" class="cx"><tspan class="cx-w">outcome</tspan> <tspan class="cx-y">:done</tspan>, <tspan class="cx-y">offers:</tspan> <tspan class="cx-k">nil</tspan>,</text>
<text x="83.0" y="587" class="cx"><tspan class="cx-y">because:</tspan> <tspan class="cx-s">&quot;the rows and the files hold the new What and Why&quot;</tspan></text>
<text x="54" y="606" class="cx-n" text-anchor="start">⋯ other code</text>
<text x="44" y="625" class="cx-n" text-anchor="end">58</text>
<text x="54.0" y="625" class="cx"><tspan class="cx-k">end</tspan></text>
