<text x="426" y="498" class="tm tag-muted" text-anchor="end">preview.rb:39</text>
<text x="26" y="515" class="tm" text-anchor="start">passes when !context.dry_run ||</text>
<text x="26" y="530" class="tm" text-anchor="start">SyncSteps.public_send(name, context)</text>
<path d="M 436 501 L 464 501" class="wire-failure"/>
<path d="M 456 496 L 464 501 L 456 506 Z" class="head"/>
<rect x="466" y="483" width="270" height="70" rx="6" class="stop-failure"/>
<text x="476" y="498" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="514" class="tm" text-anchor="start">files that cannot be read into</text>
<text x="476" y="528" class="tm" text-anchor="start">rows, the others were read:</text>
<text x="476" y="542" class="tm" text-anchor="start">%{unreadable_files}</text>
<path d="M 226 553 L 226 563" class="wire"/>
<path d="M 221 555 L 226 563 L 231 555 Z" class="head"/>
<text x="16" y="575" class="tag tag-muted" text-anchor="start">ENDS ON</text>
<rect x="16" y="583" width="300" height="70" rx="6" class="card"/>
<text x="26" y="599" class="tm" text-anchor="start">:done</text>
<text x="26" y="615" class="tm tag-muted" text-anchor="start">when context.dry_run</text>
<path d="M 316 599 L 352 599" class="wire"/>
<path d="M 344 594 L 352 599 L 344 604 Z" class="head"/>
<rect x="352" y="583" width="392" height="70" rx="6" class="end"/>
<text x="362" y="600" class="t" text-anchor="start">the call finishes, exit 0</text>
<text x="362" y="614" class="t" text-anchor="start">next: %{original_command}</text>
<text x="362" y="628" class="t" text-anchor="start">because: the preview wrote only to a disposable</text>
<text x="362" y="642" class="t" text-anchor="start">copy</text>
<rect x="16" y="661" width="300" height="42" rx="6" class="card"/>
<text x="26" y="677" class="tm" text-anchor="start">:continue</text>
<text x="26" y="693" class="tm tag-muted" text-anchor="start">otherwise</text>
<path d="M 316 677 L 352 677" class="wire"/>
<path d="M 344 672 L 352 677 L 344 682 Z" class="head"/>
<rect x="352" y="661" width="392" height="42" rx="6" class="lane-code"/>
<text x="362" y="678" class="t" text-anchor="start">next workflow: Up</text>
</svg>