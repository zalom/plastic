<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 838" width="760" height="838" role="img" xml:space="preserve">
<title>How Preview runs in plastic sync up</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="16" y="22" class="tb" text-anchor="start">Preview</text>
<text x="436" y="22" class="tm tag-muted" text-anchor="end">preview.rb:13</text>
<rect x="16" y="34" width="420" height="45" rx="6" class="card"/>
<text x="26" y="49" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="49" class="tm tag-muted" text-anchor="end">preview.rb:43</text>
<text x="26" y="66" class="t" text-anchor="start">preview the sync in an isolated copy</text>
<path d="M 226 79 L 226 89" class="wire"/>
<path d="M 221 81 L 226 89 L 231 81 Z" class="head"/>
<rect x="16" y="89" width="420" height="45" rx="6" class="card"/>
<text x="26" y="104" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="104" class="tm tag-muted" text-anchor="end">preview.rb:54</text>
<text x="26" y="121" class="tm" text-anchor="start">passes when as_real?(context, :runs?)</text>
<path d="M 436 107 L 464 107" class="wire-failure"/>
<path d="M 456 102 L 464 107 L 456 112 Z" class="head"/>
<rect x="466" y="89" width="270" height="42" rx="6" class="stop-failure"/>
<text x="476" y="104" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="120" class="tm" text-anchor="start">%{failure}</text>
<path d="M 226 134 L 226 144" class="wire"/>
<path d="M 221 136 L 226 144 L 231 136 Z" class="head"/>
<rect x="16" y="144" width="420" height="140" rx="6" class="card"/>
<text x="26" y="159" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="159" class="tm tag-muted" text-anchor="end">preview.rb:61</text>
<text x="26" y="176" class="tm" text-anchor="start">passes when as_real?(context, :writes?)</text>
<path d="M 436 162 L 464 162" class="wire-refusal"/>
<path d="M 456 157 L 464 162 L 456 167 Z" class="head"/>
<rect x="466" y="144" width="270" height="140" rx="6" class="stop-refusal"/>
<text x="476" y="159" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="175" class="tm" text-anchor="start">changed on both sides since</text>
<text x="476" y="189" class="tm" text-anchor="start">the last print, nothing</text>
<text x="476" y="203" class="tm" text-anchor="start">written. --overwrite PATH</text>
<text x="476" y="217" class="tm" text-anchor="start">reads that file into rows,</text>
<text x="476" y="231" class="tm" text-anchor="start">--overwrite reads every file,</text>
<text x="476" y="245" class="tm" text-anchor="start">--merge applies the one-sided</text>
<text x="476" y="259" class="tm" text-anchor="start">changes and lists the rest.</text>
<text x="476" y="273" class="tm" text-anchor="start">The records: %{conflicts}</text>
<path d="M 226 284 L 226 294" class="wire"/>
<path d="M 221 286 L 226 294 L 231 286 Z" class="head"/>
<rect x="16" y="294" width="420" height="112" rx="6" class="card"/>
<text x="26" y="309" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="309" class="tm tag-muted" text-anchor="end">preview.rb:62</text>
<text x="26" y="326" class="tm" text-anchor="start">passes when as_real?(context, :settled?)</text>
<path d="M 436 312 L 464 312" class="wire-refusal"/>
<path d="M 456 307 L 464 312 L 456 317 Z" class="head"/>
<rect x="466" y="294" width="270" height="112" rx="6" class="stop-refusal"/>
<text x="476" y="309" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="325" class="tm" text-anchor="start">changed on both sides since</text>
<text x="476" y="339" class="tm" text-anchor="start">the last print, left as they</text>
<text x="476" y="353" class="tm" text-anchor="start">are. --overwrite PATH reads</text>
<text x="476" y="367" class="tm" text-anchor="start">that file into rows,</text>
<text x="476" y="381" class="tm" text-anchor="start">--overwrite reads every file.</text>
<text x="476" y="395" class="tm" text-anchor="start">The records: %{conflicts}</text>
<path d="M 226 406 L 226 416" class="wire"/>
<path d="M 221 408 L 226 416 L 231 408 Z" class="head"/>
<rect x="16" y="416" width="420" height="98" rx="6" class="card"/>
<text x="26" y="431" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="431" class="tm tag-muted" text-anchor="end">preview.rb:67</text>
<text x="26" y="448" class="tm" text-anchor="start">passes when as_real?(context, :readable?)</text>
<path d="M 436 434 L 464 434" class="wire-failure"/>
<path d="M 456 429 L 464 434 L 456 439 Z" class="head"/>
<rect x="466" y="416" width="270" height="98" rx="6" class="stop-failure"/>
<text x="476" y="431" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="447" class="tm" text-anchor="start">intent folders that could not</text>
<text x="476" y="461" class="tm" text-anchor="start">be read, the others were read:</text>
<text x="476" y="475" class="tm" text-anchor="start">%{unreadable} fix or remove</text>
<text x="476" y="489" class="tm" text-anchor="start">each folder named, then run</text>
<text x="476" y="503" class="tm" text-anchor="start">plastic sync up again</text>
<path d="M 226 514 L 226 524" class="wire"/>
<path d="M 221 516 L 226 524 L 231 516 Z" class="head"/>
<rect x="16" y="524" width="420" height="70" rx="6" class="card"/>
<text x="26" y="539" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="539" class="tm tag-muted" text-anchor="end">preview.rb:68</text>
<text x="26" y="556" class="tm" text-anchor="start">passes when as_real?(context, :files_read?)</text>
<path d="M 436 542 L 464 542" class="wire-failure"/>
<path d="M 456 537 L 464 542 L 456 547 Z" class="head"/>
<rect x="466" y="524" width="270" height="70" rx="6" class="stop-failure"/>
<text x="476" y="539" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="555" class="tm" text-anchor="start">files that cannot be read into</text>
<text x="476" y="569" class="tm" text-anchor="start">rows, the others were read:</text>
<text x="476" y="583" class="tm" text-anchor="start">%{unreadable_files}</text>
<path d="M 226 594 L 226 604" class="wire"/>
<path d="M 221 596 L 226 604 L 231 596 Z" class="head"/>
<rect x="16" y="604" width="420" height="70" rx="6" class="card"/>
<text x="26" y="619" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="619" class="tm tag-muted" text-anchor="end">preview.rb:70</text>
<text x="26" y="636" class="tm" text-anchor="start">passes when as_real?(context, :rowless_read?)</text>
<path d="M 436 622 L 464 622" class="wire-failure"/>
<path d="M 456 617 L 464 622 L 456 627 Z" class="head"/>
<rect x="466" y="604" width="270" height="70" rx="6" class="stop-failure"/>
<text x="476" y="619" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="635" class="tm" text-anchor="start">files that cannot be read into</text>
<text x="476" y="649" class="tm" text-anchor="start">rows, the others were read:</text>
<text x="476" y="663" class="tm" text-anchor="start">%{unreadable_files}</text>
<path d="M 226 674 L 226 684" class="wire"/>
<path d="M 221 676 L 226 684 L 231 676 Z" class="head"/>
<text x="16" y="696" class="tag tag-muted" text-anchor="start">ENDS ON</text>
<rect x="16" y="704" width="300" height="70" rx="6" class="card"/>
<text x="26" y="720" class="tm" text-anchor="start">:done</text>
<text x="26" y="736" class="tm tag-muted" text-anchor="start">when context.dry_run</text>
<path d="M 316 720 L 352 720" class="wire"/>
<path d="M 344 715 L 352 720 L 344 725 Z" class="head"/>
<rect x="352" y="704" width="392" height="70" rx="6" class="end"/>
<text x="362" y="721" class="t" text-anchor="start">the call finishes, exit 0</text>
<text x="362" y="735" class="t" text-anchor="start">next: %{original_command}</text>
<text x="362" y="749" class="t" text-anchor="start">because: the preview wrote only to a disposable</text>
<text x="362" y="763" class="t" text-anchor="start">copy</text>
<rect x="16" y="782" width="300" height="42" rx="6" class="card"/>
<text x="26" y="798" class="tm" text-anchor="start">:continue</text>
<text x="26" y="814" class="tm tag-muted" text-anchor="start">otherwise</text>
<path d="M 316 798 L 352 798" class="wire"/>
<path d="M 344 793 L 352 798 L 344 803 Z" class="head"/>
<rect x="352" y="782" width="392" height="42" rx="6" class="lane-code"/>
<text x="362" y="799" class="t" text-anchor="start">next workflow: Up</text>
</svg>