<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 898" width="760" height="898" role="img" xml:space="preserve">
<title>How Up runs in plastic sync up</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="16" y="22" class="tb" text-anchor="start">Up</text>
<text x="436" y="22" class="tm tag-muted" text-anchor="end">up.rb:11</text>
<rect x="16" y="34" width="420" height="45" rx="6" class="card"/>
<text x="26" y="49" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="49" class="tm tag-muted" text-anchor="end">sync_steps.rb:111</text>
<text x="26" y="66" class="t" text-anchor="start">plan the sync</text>
<path d="M 226 79 L 226 89" class="wire"/>
<path d="M 221 81 L 226 89 L 231 81 Z" class="head"/>
<rect x="16" y="89" width="420" height="45" rx="6" class="card"/>
<text x="26" y="104" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="104" class="tm tag-muted" text-anchor="end">sync_steps.rb:112</text>
<text x="26" y="121" class="tm" text-anchor="start">passes when public_send(name, context)</text>
<path d="M 436 107 L 464 107" class="wire-failure"/>
<path d="M 456 102 L 464 107 L 456 112 Z" class="head"/>
<rect x="466" y="89" width="270" height="42" rx="6" class="stop-failure"/>
<text x="476" y="104" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="120" class="tm" text-anchor="start">%{failure}</text>
<path d="M 226 134 L 226 144" class="wire"/>
<path d="M 221 136 L 226 144 L 231 136 Z" class="head"/>
<rect x="16" y="144" width="420" height="140" rx="6" class="card"/>
<text x="26" y="159" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="159" class="tm tag-muted" text-anchor="end">sync_steps.rb:103</text>
<text x="26" y="176" class="tm" text-anchor="start">passes when public_send(name, context)</text>
<path d="M 436 162 L 464 162" class="wire-refusal"/>
<path d="M 456 157 L 464 162 L 456 167 Z" class="head"/>
<rect x="466" y="144" width="270" height="140" rx="6" class="stop-refusal"/>
<text x="476" y="159" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="175" class="tm" text-anchor="start">changed on both sides since</text>
<text x="476" y="189" class="tm" text-anchor="start">the last print, nothing</text>
<text x="476" y="203" class="tm" text-anchor="start">written. --overwrite PATH</text>
<text x="476" y="217" class="tm" text-anchor="start">reads that file into rows,</text>
<text x="476" y="231" class="tm" text-anchor="start">--overwrite reads every file,</text>
<text x="476" y="245" class="tm" text-anchor="start">--merge applies the one-sided</text>
<text x="476" y="259" class="tm" text-anchor="start">changes and lists the rest.</text>
<text x="476" y="273" class="tm" text-anchor="start">The records: %{conflicts}</text>
<path d="M 226 284 L 226 294" class="wire"/>
<path d="M 221 286 L 226 294 L 231 286 Z" class="head"/>
<rect x="16" y="294" width="420" height="59" rx="6" class="card"/>
<text x="26" y="309" class="tag tag-muted" text-anchor="start">STEP</text>
<text x="426" y="309" class="tm tag-muted" text-anchor="end">sync_steps.rb:117</text>
<text x="26" y="326" class="t" text-anchor="start">apply the changes</text>
<text x="26" y="341" class="tm" text-anchor="start">done when plan(context, direction).pending.zero?</text>
<path d="M 436 312 L 464 312" class="wire-failure"/>
<path d="M 456 307 L 464 312 L 456 317 Z" class="head"/>
<rect x="466" y="294" width="270" height="56" rx="6" class="stop-failure"/>
<text x="476" y="309" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="325" class="tm" text-anchor="start">the step ran and its done</text>
<text x="476" y="339" class="tm" text-anchor="start">check still fails</text>
<path d="M 226 353 L 226 363" class="wire"/>
<path d="M 221 355 L 226 363 L 231 355 Z" class="head"/>
<rect x="16" y="363" width="420" height="45" rx="6" class="card"/>
<text x="26" y="378" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="378" class="tm tag-muted" text-anchor="end">sync_steps.rb:118</text>
<text x="26" y="395" class="t" text-anchor="start">say what changed</text>
<path d="M 226 408 L 226 418" class="wire"/>
<path d="M 221 410 L 226 418 L 231 410 Z" class="head"/>
<rect x="16" y="418" width="420" height="112" rx="6" class="card"/>
<text x="26" y="433" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="433" class="tm tag-muted" text-anchor="end">sync_steps.rb:103</text>
<text x="26" y="450" class="tm" text-anchor="start">passes when public_send(name, context)</text>
<path d="M 436 436 L 464 436" class="wire-refusal"/>
<path d="M 456 431 L 464 436 L 456 441 Z" class="head"/>
<rect x="466" y="418" width="270" height="112" rx="6" class="stop-refusal"/>
<text x="476" y="433" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="449" class="tm" text-anchor="start">changed on both sides since</text>
<text x="476" y="463" class="tm" text-anchor="start">the last print, left as they</text>
<text x="476" y="477" class="tm" text-anchor="start">are. --overwrite PATH reads</text>
<text x="476" y="491" class="tm" text-anchor="start">that file into rows,</text>
<text x="476" y="505" class="tm" text-anchor="start">--overwrite reads every file.</text>
<text x="476" y="519" class="tm" text-anchor="start">The records: %{conflicts}</text>
<path d="M 226 530 L 226 540" class="wire"/>
<path d="M 221 532 L 226 540 L 231 532 Z" class="head"/>
<rect x="16" y="540" width="420" height="98" rx="6" class="card"/>
<text x="26" y="555" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="555" class="tm tag-muted" text-anchor="end">sync_steps.rb:103</text>
<text x="26" y="572" class="tm" text-anchor="start">passes when public_send(name, context)</text>
<path d="M 436 558 L 464 558" class="wire-failure"/>
<path d="M 456 553 L 464 558 L 456 563 Z" class="head"/>
<rect x="466" y="540" width="270" height="98" rx="6" class="stop-failure"/>
<text x="476" y="555" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="571" class="tm" text-anchor="start">intent folders that could not</text>
<text x="476" y="585" class="tm" text-anchor="start">be read, the others were read:</text>
<text x="476" y="599" class="tm" text-anchor="start">%{unreadable} fix or remove</text>
<text x="476" y="613" class="tm" text-anchor="start">each folder named, then run</text>
<text x="476" y="627" class="tm" text-anchor="start">plastic sync up again</text>
<path d="M 226 638 L 226 648" class="wire"/>
<path d="M 221 640 L 226 648 L 231 640 Z" class="head"/>
<rect x="16" y="648" width="420" height="70" rx="6" class="card"/>
<text x="26" y="663" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="663" class="tm tag-muted" text-anchor="end">sync_steps.rb:104</text>
<text x="26" y="680" class="tm" text-anchor="start">passes when public_send(name, context)</text>
<path d="M 436 666 L 464 666" class="wire-failure"/>
<path d="M 456 661 L 464 666 L 456 671 Z" class="head"/>
<rect x="466" y="648" width="270" height="70" rx="6" class="stop-failure"/>
<text x="476" y="663" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="679" class="tm" text-anchor="start">files that cannot be read into</text>
<text x="476" y="693" class="tm" text-anchor="start">rows, the others were read:</text>
<text x="476" y="707" class="tm" text-anchor="start">%{unreadable_files}</text>
<path d="M 226 718 L 226 728" class="wire"/>
<path d="M 221 720 L 226 728 L 231 720 Z" class="head"/>
<rect x="16" y="728" width="420" height="70" rx="6" class="card"/>
<text x="26" y="743" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="743" class="tm tag-muted" text-anchor="end">sync_steps.rb:104</text>
<text x="26" y="760" class="tm" text-anchor="start">passes when public_send(name, context)</text>
<path d="M 436 746 L 464 746" class="wire-failure"/>
<path d="M 456 741 L 464 746 L 456 751 Z" class="head"/>
<rect x="466" y="728" width="270" height="70" rx="6" class="stop-failure"/>
<text x="476" y="743" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="759" class="tm" text-anchor="start">files that cannot be read into</text>
<text x="476" y="773" class="tm" text-anchor="start">rows, the others were read:</text>
<text x="476" y="787" class="tm" text-anchor="start">%{unreadable_files}</text>
<path d="M 226 798 L 226 808" class="wire"/>
<path d="M 221 800 L 226 808 L 231 800 Z" class="head"/>
<text x="16" y="820" class="tag tag-muted" text-anchor="start">ENDS ON</text>
<rect x="16" y="828" width="300" height="56" rx="6" class="card"/>
<text x="26" y="844" class="tm" text-anchor="start">:done</text>
<text x="26" y="860" class="tm tag-muted" text-anchor="start">always</text>
<path d="M 316 844 L 352 844" class="wire"/>
<path d="M 344 839 L 352 844 L 344 849 Z" class="head"/>
<rect x="352" y="828" width="392" height="56" rx="6" class="end"/>
<text x="362" y="845" class="t" text-anchor="start">the call finishes, exit 0</text>
<text x="362" y="859" class="t" text-anchor="start">next: plastic next</text>
<text x="362" y="873" class="t" text-anchor="start">because: the rows hold every file changed by hand</text>
</svg>