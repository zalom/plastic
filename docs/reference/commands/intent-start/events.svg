<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 986" width="834" height="986" role="img" xml:space="preserve">
<title>The events of one call of plastic intent start, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic intent start, from top to bottom</text>
<rect x="24" y="64" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="83" r="8" class="badge"/>
<text x="44" y="87" class="badge-t" text-anchor="middle">1</text>
<text x="64" y="86" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="106" class="t" text-anchor="start">Read the intent and its spec.</text>
<path d="M 424 76 L 456 76 L 456 87 L 480 87" class="wire-failure"/>
<path d="M 472 82 L 480 87 L 472 92 Z" class="head"/>
<rect x="480" y="64" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="82" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="100" class="t" text-anchor="start">No intent &lt;intent id&gt; in this store.</text>
<path d="M 424 82 L 450 82 L 450 149 L 480 149" class="wire-failure"/>
<path d="M 472 144 L 480 149 L 472 154 Z" class="head"/>
<rect x="480" y="118" width="330" height="62" rx="6" class="stop-failure"/>
<text x="492" y="136" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="154" class="t" text-anchor="start">&lt;start words&gt; names no session; set</text>
<text x="492" y="170" class="t" text-anchor="start">PLASTIC_SESSION.</text>
<path d="M 424 88 L 444 88 L 444 211 L 480 211" class="wire-refusal"/>
<path d="M 472 206 L 480 211 L 472 216 Z" class="head"/>
<rect x="480" y="188" width="330" height="46" rx="6" class="stop-refusal"/>
<text x="492" y="206" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="224" class="t" text-anchor="start">The session of the call has ended.</text>
<path d="M 424 94 L 438 94 L 438 273 L 480 273" class="wire-refusal"/>
<path d="M 472 268 L 480 273 L 472 278 Z" class="head"/>
<rect x="480" y="242" width="330" height="62" rx="6" class="stop-refusal"/>
<text x="492" y="260" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="278" class="t" text-anchor="start">A closed intent cannot start; pick other work.</text>
<text x="492" y="294" class="t" text-anchor="start">next: plastic next</text>
<path d="M 424 100 L 432 100 L 432 351 L 480 351" class="wire-refusal"/>
<path d="M 472 346 L 480 351 L 472 356 Z" class="head"/>
<rect x="480" y="312" width="330" height="78" rx="6" class="stop-refusal"/>
<text x="492" y="330" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="348" class="t" text-anchor="start">An archived intent cannot start; unarchive it</text>
<text x="492" y="364" class="t" text-anchor="start">first.</text>
<text x="492" y="380" class="t" text-anchor="start">next: plastic intent unarchive &lt;intent id&gt;</text>
<path d="M 64 115 L 64 416" class="wire"/>
<path d="M 59 408 L 64 416 L 69 408 Z" class="head"/>
<rect x="24" y="416" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="435" r="8" class="badge"/>
<text x="44" y="439" class="badge-t" text-anchor="middle">2</text>
<text x="64" y="438" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="458" class="t" text-anchor="start">Check the driver.</text>
<path d="M 424 455 L 480 455" class="wire-refusal"/>
<path d="M 472 450 L 480 455 L 472 460 Z" class="head"/>
<rect x="480" y="416" width="330" height="78" rx="6" class="stop-refusal"/>
<text x="492" y="434" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="452" class="t" text-anchor="start">&lt;driver problem&gt;; on the owner&#39;s word, plastic</text>
<text x="492" y="468" class="t" text-anchor="start">&lt;start words&gt; &lt;intent id&gt; --take-over REASON</text>
<text x="492" y="484" class="t" text-anchor="start">takes it over.</text>
<path d="M 64 467 L 64 520" class="wire"/>
<path d="M 59 512 L 64 520 L 69 512 Z" class="head"/>
<rect x="24" y="520" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="539" r="8" class="badge"/>
<text x="44" y="543" class="badge-t" text-anchor="middle">3</text>
<text x="64" y="542" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="562" class="t" text-anchor="start">Go in progress.</text>
<path d="M 64 571 L 64 597" class="wire"/>
<path d="M 59 589 L 64 597 L 69 589 Z" class="head"/>
<rect x="24" y="597" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="616" r="8" class="badge"/>
<text x="44" y="620" class="badge-t" text-anchor="middle">4</text>
<text x="64" y="619" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="639" class="t" text-anchor="start">Take the driver claim.</text>
<path d="M 64 648 L 64 674" class="wire"/>
<path d="M 59 666 L 64 674 L 69 666 Z" class="head"/>
<rect x="24" y="674" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="693" r="8" class="badge"/>
<text x="44" y="697" class="badge-t" text-anchor="middle">5</text>
<text x="64" y="696" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="716" class="t" text-anchor="start">Name the code worktree.</text>
<path d="M 424 686 L 444 686 L 444 713 L 480 713" class="wire-end"/>
<path d="M 472 708 L 480 713 L 472 718 Z" class="head"/>
<rect x="480" y="674" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="692" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="710" class="t" text-anchor="start">The worktree of intent &lt;intent id&gt; is not made</text>
<text x="492" y="726" class="t" text-anchor="start">yet.</text>
<text x="492" y="742" class="t" text-anchor="start">next: &lt;start command&gt; &lt;intent id&gt;</text>
<path d="M 424 699 L 438 699 L 438 799 L 480 799" class="wire-end"/>
<path d="M 472 794 L 480 799 L 472 804 Z" class="head"/>
<rect x="480" y="760" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="778" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="796" class="t" text-anchor="start">The spec names no done criterion, has an open</text>
<text x="492" y="812" class="t" text-anchor="start">decision, or has no go-ahead.</text>
<text x="492" y="828" class="t" text-anchor="start">next: plastic intent spec &lt;intent id&gt;</text>
<path d="M 424 712 L 432 712 L 432 877 L 480 877" class="wire-end"/>
<path d="M 472 872 L 480 877 L 472 882 Z" class="head"/>
<rect x="480" y="846" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="864" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="882" class="t" text-anchor="start">Intent &lt;intent id&gt; is in progress.</text>
<text x="492" y="898" class="t" text-anchor="start">next: plastic intent brief &lt;intent id&gt;</text>
<rect x="24" y="938" width="14" height="14" rx="3" class="lane-code"/>
<text x="44" y="950" class="k" text-anchor="start">Code Workflow</text>
<rect x="140" y="938" width="14" height="14" rx="3" class="stop-failure"/>
<text x="160" y="950" class="k" text-anchor="start">Stops with a failure</text>
<rect x="276" y="938" width="14" height="14" rx="3" class="stop-refusal"/>
<text x="296" y="950" class="k" text-anchor="start">Stops for the owner</text>
<rect x="414" y="938" width="14" height="14" rx="3" class="stop-end"/>
<text x="434" y="950" class="k" text-anchor="start">Ends</text>
</svg>