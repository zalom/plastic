<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 544" width="846" height="544" role="img" xml:space="preserve">
<title>The workflows of one call of plastic intent end, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic intent end: its workflows and its endings</text>
<rect x="296" y="56" width="254" height="83" rx="6" class="lane-code"/>
<text x="308" y="76" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="308" y="96" class="t" text-anchor="start">Reads what closing the intent</text>
<text x="308" y="113" class="t" text-anchor="start">needs: the rows, the verdict,</text>
<text x="308" y="130" class="t" text-anchor="start">outcome.md and the review.</text>
<rect x="30" y="56" width="222" height="83" rx="6" class="stop-end"/>
<text x="42" y="76" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="42" y="96" class="t" text-anchor="start">Intent &lt;intent id&gt; is</text>
<text x="42" y="113" class="t" text-anchor="start">already done.</text>
<text x="42" y="130" class="t" text-anchor="start">next: plastic next</text>
<path d="M 296 97 L 274 97" class="wire-end"/>
<path d="M 274 97 L 274 97" class="wire-end"/>
<path d="M 274 97 L 252 97" class="wire-end"/>
<path d="M 260 92 L 252 97 L 260 102 Z" class="head"/>
<rect x="594" y="56" width="222" height="100" rx="6" class="stop-refusal"/>
<text x="606" y="76" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 1 OR 3</text>
<text x="606" y="96" class="t" text-anchor="start">A check fails or the step</text>
<text x="606" y="113" class="t" text-anchor="start">belongs to the owner. The</text>
<text x="606" y="130" class="t" text-anchor="start">events below show each</text>
<text x="606" y="147" class="t" text-anchor="start">check.</text>
<path d="M 550 97 L 594 97" class="wire-refusal"/>
<path d="M 586 92 L 594 97 L 586 102 Z" class="head"/>
<path d="M 423 139 L 423 178 L 157 178 L 157 186" class="wire"/>
<text x="157" y="200" class="k" text-anchor="middle">the intent still needs records or</text>
<text x="157" y="214" class="k" text-anchor="middle">a verdict before it can end</text>
<path d="M 157 224 L 157 238" class="wire"/>
<path d="M 152 230 L 157 238 L 162 230 Z" class="head"/>
<rect x="30" y="238" width="254" height="83" rx="6" class="lane-agent"/>
<text x="42" y="258" class="tag tag-agent" text-anchor="start">Agent Workflow</text>
<text x="42" y="278" class="t" text-anchor="start">Has the agent write the records</text>
<text x="42" y="295" class="t" text-anchor="start">the close needs and have the</text>
<text x="42" y="312" class="t" text-anchor="start">work judged.</text>
<path d="M 157 321 L 157 347" class="wire"/>
<path d="M 152 339 L 157 347 L 162 339 Z" class="head"/>
<rect x="30" y="347" width="254" height="100" rx="6" class="stop-handoff"/>
<text x="42" y="367" class="tag tag-handoff" text-anchor="start">HANDS OFF, EXIT 1</text>
<text x="42" y="387" class="t" text-anchor="start">Intent &lt;intent id&gt; cannot end</text>
<text x="42" y="404" class="t" text-anchor="start">yet. &lt;missing&gt;.</text>
<text x="42" y="421" class="t" text-anchor="start">next: plastic intent end</text>
<text x="42" y="438" class="t" text-anchor="start">&lt;intent id&gt;</text>
<path d="M 423 139 L 423 178 L 423 178 L 423 186" class="wire"/>
<text x="423" y="200" class="k" text-anchor="middle">the delivery of the work is not</text>
<text x="423" y="214" class="k" text-anchor="middle">recorded yet</text>
<path d="M 423 224 L 423 238" class="wire"/>
<path d="M 418 230 L 423 238 L 428 230 Z" class="head"/>
<rect x="296" y="238" width="254" height="83" rx="6" class="lane-agent"/>
<text x="308" y="258" class="tag tag-agent" text-anchor="start">Agent Workflow</text>
<text x="308" y="278" class="t" text-anchor="start">Has the agent record how the</text>
<text x="308" y="295" class="t" text-anchor="start">work of the intent was</text>
<text x="308" y="312" class="t" text-anchor="start">delivered.</text>
<path d="M 423 321 L 423 347" class="wire"/>
<path d="M 418 339 L 423 347 L 428 339 Z" class="head"/>
<rect x="296" y="347" width="254" height="117" rx="6" class="stop-handoff"/>
<text x="308" y="367" class="tag tag-handoff" text-anchor="start">HANDS OFF, EXIT 1</text>
<text x="308" y="387" class="t" text-anchor="start">The agent records the delivery,</text>
<text x="308" y="404" class="t" text-anchor="start">and the architecture map after</text>
<text x="308" y="421" class="t" text-anchor="start">code, in outcome.md.</text>
<text x="308" y="438" class="t" text-anchor="start">next: plastic intent end</text>
<text x="308" y="455" class="t" text-anchor="start">&lt;intent id&gt;</text>
<path d="M 423 139 L 423 178 L 689 178 L 689 186" class="wire"/>
<text x="689" y="200" class="k" text-anchor="middle">the records, the verdict and the</text>
<text x="689" y="214" class="k" text-anchor="middle">delivery are in place</text>
<path d="M 689 224 L 689 238" class="wire"/>
<path d="M 684 230 L 689 238 L 694 230 Z" class="head"/>
<rect x="562" y="238" width="254" height="66" rx="6" class="lane-code"/>
<text x="574" y="258" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="574" y="278" class="t" text-anchor="start">Closes the intent and ends its</text>
<text x="574" y="295" class="t" text-anchor="start">run of work.</text>
<path d="M 689 304 L 689 326 L 689 326 L 689 334" class="wire"/>
<text x="689" y="348" class="k" text-anchor="middle">intent &lt;intent id&gt; is closed</text>
<path d="M 689 358 L 689 372" class="wire"/>
<path d="M 684 364 L 689 372 L 694 364 Z" class="head"/>
<rect x="562" y="372" width="254" height="66" rx="6" class="lane-agent"/>
<text x="574" y="392" class="tag tag-agent" text-anchor="start">Agent Workflow</text>
<text x="574" y="412" class="t" text-anchor="start">Has the agent stop what the</text>
<text x="574" y="429" class="t" text-anchor="start">intent started.</text>
<path d="M 689 438 L 689 464" class="wire"/>
<path d="M 684 456 L 689 464 L 694 456 Z" class="head"/>
<rect x="562" y="464" width="254" height="66" rx="6" class="stop-end"/>
<text x="574" y="484" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="574" y="504" class="t" text-anchor="start">The agent stops the processes</text>
<text x="574" y="521" class="t" text-anchor="start">and agents the intent started.</text>
</svg>