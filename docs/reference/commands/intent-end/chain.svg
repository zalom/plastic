<text x="238" y="171" class="tb" text-anchor="start">CheckMerge</text>
<text x="238" y="186" class="tm" text-anchor="start">:agent_check_merge</text>
<rect x="432" y="136" width="180" height="56" rx="6" class="lane-code"/>
