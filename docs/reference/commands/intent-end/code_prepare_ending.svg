}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="16" y="22" class="tb" text-anchor="start">PrepareEnding</text>
<text x="436" y="22" class="tm tag-muted" text-anchor="end">prepare_ending.rb:13</text>
<rect x="16" y="34" width="420" height="45" rx="6" class="card"/>
<text x="26" y="49" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="49" class="tm tag-muted" text-anchor="end">prepare_ending.rb:16</text>
<text x="26" y="66" class="t" text-anchor="start">read the intent</text>
<path d="M 226 79 L 226 89" class="wire"/>
<path d="M 221 81 L 226 89 L 231 81 Z" class="head"/>
<rect x="16" y="89" width="420" height="56" rx="6" class="card"/>
<text x="26" y="104" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="104" class="tm tag-muted" text-anchor="end">prepare_ending.rb:21</text>
<text x="26" y="121" class="tm" text-anchor="start">passes when !context.intent.nil?</text>
<path d="M 436 107 L 464 107" class="wire-failure"/>
<path d="M 456 102 L 464 107 L 456 112 Z" class="head"/>
<rect x="466" y="89" width="270" height="56" rx="6" class="stop-failure"/>
<text x="476" y="104" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="120" class="tm" text-anchor="start">no intent %{intent_id} in this</text>
<text x="476" y="134" class="tm" text-anchor="start">store</text>
<path d="M 226 145 L 226 155" class="wire"/>
<path d="M 221 147 L 226 155 L 231 147 Z" class="head"/>
<rect x="16" y="155" width="420" height="60" rx="6" class="card"/>
<text x="26" y="170" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="170" class="tm tag-muted" text-anchor="end">prepare_ending.rb:22</text>
<text x="26" y="187" class="tm" text-anchor="start">passes when context.closed || %w[open</text>
<text x="26" y="202" class="tm" text-anchor="start">active].include?(context.intent.status)</text>
<path d="M 436 173 L 464 173" class="wire-failure"/>
<path d="M 456 168 L 464 173 L 456 178 Z" class="head"/>
<rect x="466" y="155" width="270" height="56" rx="6" class="stop-failure"/>
<text x="476" y="170" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="186" class="tm" text-anchor="start">intent %{intent_id} is not</text>
<text x="476" y="200" class="tm" text-anchor="start">open or active</text>
<path d="M 226 215 L 226 225" class="wire"/>
<path d="M 221 217 L 226 225 L 231 217 Z" class="head"/>
<rect x="16" y="225" width="420" height="45" rx="6" class="card"/>
<text x="26" y="240" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="240" class="tm tag-muted" text-anchor="end">prepare_ending.rb:25</text>
<text x="26" y="257" class="t" text-anchor="start">check delivery ownership</text>
<path d="M 226 270 L 226 280" class="wire"/>
<path d="M 221 272 L 226 280 L 231 272 Z" class="head"/>
<rect x="16" y="280" width="420" height="45" rx="6" class="card"/>
<text x="26" y="295" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="295" class="tm tag-muted" text-anchor="end">prepare_ending.rb:29</text>
<text x="26" y="312" class="tm" text-anchor="start">passes when context.problem.nil?</text>
<path d="M 436 298 L 464 298" class="wire-refusal"/>
<path d="M 456 293 L 464 298 L 456 303 Z" class="head"/>
<rect x="466" y="280" width="270" height="42" rx="6" class="stop-refusal"/>
<text x="476" y="295" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="311" class="tm" text-anchor="start">%{problem}</text>
<path d="M 226 325 L 226 335" class="wire"/>
<path d="M 221 327 L 226 335 L 231 327 Z" class="head"/>
<rect x="16" y="335" width="420" height="45" rx="6" class="card"/>
<text x="26" y="350" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="350" class="tm tag-muted" text-anchor="end">prepare_ending.rb:31</text>
<text x="26" y="367" class="t" text-anchor="start">check the completion records</text>
<path d="M 226 380 L 226 390" class="wire"/>
<path d="M 221 382 L 226 390 L 231 382 Z" class="head"/>
<rect x="16" y="390" width="420" height="98" rx="6" class="card"/>
<text x="26" y="405" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="405" class="tm tag-muted" text-anchor="end">prepare_ending.rb:73</text>
<text x="26" y="422" class="tm" text-anchor="start">passes when !context.used_up</text>
<path d="M 436 408 L 464 408" class="wire-refusal"/>
<path d="M 456 403 L 464 408 L 456 413 Z" class="head"/>
<rect x="466" y="390" width="270" height="98" rx="6" class="stop-refusal"/>
<text x="476" y="405" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="421" class="tm" text-anchor="start">the judge&#39;s review round of</text>
<text x="476" y="435" class="tm" text-anchor="start">intent %{intent_id} is used;</text>
<text x="476" y="449" class="tm" text-anchor="start">the owner decides between</text>
<text x="476" y="463" class="tm" text-anchor="start">abandoning the intent and a</text>
<text x="476" y="477" class="tm" text-anchor="start">follow-up intent</text>
<path d="M 226 488 L 226 498" class="wire"/>
<path d="M 221 490 L 226 498 L 231 490 Z" class="head"/>
<rect x="16" y="498" width="420" height="126" rx="6" class="card"/>
<text x="26" y="513" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="513" class="tm tag-muted" text-anchor="end">prepare_ending.rb:75</text>
<text x="26" y="530" class="tm" text-anchor="start">passes when !context.awaiting_approval</text>
<path d="M 436 516 L 464 516" class="wire-refusal"/>
<path d="M 456 511 L 464 516 L 456 521 Z" class="head"/>
<rect x="466" y="498" width="270" height="126" rx="6" class="stop-refusal"/>
<text x="476" y="513" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="529" class="tm" text-anchor="start">the pull request of intent</text>
<text x="476" y="543" class="tm" text-anchor="start">%{intent_id} waits for the</text>
<text x="476" y="557" class="tm" text-anchor="start">person&#39;s approval; add the</text>
<text x="476" y="571" class="tm" text-anchor="start">line Approved: to the</text>
<text x="476" y="585" class="tm" text-anchor="start">Verification section of</text>
<text x="476" y="599" class="tm" text-anchor="start">outcome.md once they approve,</text>
<text x="476" y="613" class="tm" text-anchor="start">then run plastic sync up</text>
<path d="M 226 624 L 226 634" class="wire"/>
<path d="M 221 626 L 226 634 L 231 626 Z" class="head"/>
<text x="16" y="646" class="tag tag-muted" text-anchor="start">ENDS ON</text>
<rect x="16" y="654" width="300" height="56" rx="6" class="card"/>
<text x="26" y="670" class="tm" text-anchor="start">:closed</text>
<text x="26" y="686" class="tm tag-muted" text-anchor="start">when context.closed</text>
<path d="M 316 670 L 352 670" class="wire"/>
<path d="M 344 665 L 352 670 L 344 675 Z" class="head"/>
<rect x="352" y="654" width="392" height="56" rx="6" class="end"/>
<text x="362" y="671" class="t" text-anchor="start">the call finishes, exit 0</text>
<text x="362" y="685" class="t" text-anchor="start">next: plastic next</text>
<text x="362" y="699" class="t" text-anchor="start">because: intent %{intent_id} is already done</text>
<rect x="16" y="718" width="300" height="56" rx="6" class="card"/>
<text x="26" y="734" class="tm" text-anchor="start">:agent_needed</text>
<text x="26" y="750" class="tm tag-muted" text-anchor="start">when !context.requirements.empty? ||</text>
<text x="26" y="764" class="tm tag-muted" text-anchor="start">!context.judged</text>
<path d="M 316 734 L 352 734" class="wire"/>
<path d="M 344 729 L 352 734 L 344 739 Z" class="head"/>
<rect x="352" y="718" width="392" height="56" rx="6" class="lane-agent"/>
<text x="362" y="735" class="t" text-anchor="start">next workflow: FinishIntent</text>
<rect x="16" y="782" width="300" height="42" rx="6" class="card"/>
<text x="26" y="798" class="tm" text-anchor="start">:unverified</text>
<text x="26" y="814" class="tm tag-muted" text-anchor="start">when !verified?(context)</text>
<path d="M 316 798 L 352 798" class="wire"/>
<path d="M 344 793 L 352 798 L 344 803 Z" class="head"/>
<rect x="352" y="782" width="392" height="42" rx="6" class="lane-agent"/>
<text x="362" y="799" class="t" text-anchor="start">next workflow: CheckMerge</text>
<rect x="16" y="832" width="300" height="42" rx="6" class="card"/>
<text x="26" y="848" class="tm" text-anchor="start">:ready</text>
<text x="26" y="864" class="tm tag-muted" text-anchor="start">otherwise</text>
<path d="M 316 848 L 352 848" class="wire"/>
<path d="M 344 843 L 352 848 L 344 853 Z" class="head"/>
<rect x="352" y="832" width="392" height="42" rx="6" class="lane-code"/>
<text x="362" y="849" class="t" text-anchor="start">next workflow: CloseIntent</text>
</svg>