<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 888" width="760" height="888" role="img" xml:space="preserve">
<title>How PrepareEnding runs in plastic intent end</title>
<style>.ground { fill: #e9e5dc; }
