<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 1015" width="834" height="1015" role="img" xml:space="preserve">
<title>The events of one call of plastic store sync down, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic store sync down, from top to bottom</text>
<rect x="24" y="64" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="83" r="8" class="badge"/>
<text x="44" y="87" class="badge-t" text-anchor="middle">1</text>
<text x="64" y="86" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="106" class="t" text-anchor="start">Preview the sync in an isolated copy.</text>
<path d="M 424 76 L 450 76 L 450 87 L 480 87" class="wire-failure"/>
<path d="M 472 82 L 480 87 L 472 92 Z" class="head"/>
<rect x="480" y="64" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="82" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="100" class="t" text-anchor="start">An overwrite path names no file and no rows.</text>
<path d="M 424 85 L 444 85 L 444 181 L 480 181" class="wire-refusal"/>
<path d="M 472 176 L 480 181 L 472 186 Z" class="head"/>
<rect x="480" y="118" width="330" height="126" rx="6" class="stop-refusal"/>
<text x="492" y="136" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="154" class="t" text-anchor="start">Changed on both sides since the last print,</text>
<text x="492" y="170" class="t" text-anchor="start">nothing written. --overwrite PATH prints that</text>
<text x="492" y="186" class="t" text-anchor="start">record&#39;s rows over the file, --overwrite</text>
<text x="492" y="202" class="t" text-anchor="start">prints every record, --merge applies the</text>
<text x="492" y="218" class="t" text-anchor="start">one-sided changes and lists the rest. The</text>
<text x="492" y="234" class="t" text-anchor="start">records: &lt;conflicts&gt;.</text>
<path d="M 424 94 L 438 94 L 438 299 L 480 299" class="wire-refusal"/>
<path d="M 472 294 L 480 299 L 472 304 Z" class="head"/>
<rect x="480" y="252" width="330" height="94" rx="6" class="stop-refusal"/>
<text x="492" y="270" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="288" class="t" text-anchor="start">Changed on both sides since the last print,</text>
<text x="492" y="304" class="t" text-anchor="start">left as they are. --overwrite PATH prints that</text>
<text x="492" y="320" class="t" text-anchor="start">record&#39;s rows over the file, --overwrite</text>
<text x="492" y="336" class="t" text-anchor="start">prints every record. The records: &lt;conflicts&gt;.</text>
<path d="M 424 103 L 432 103 L 432 385 L 480 385" class="wire-end"/>
<path d="M 472 380 L 480 385 L 472 390 Z" class="head"/>
<rect x="480" y="354" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="372" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="390" class="t" text-anchor="start">The preview wrote only to a disposable copy.</text>
<text x="492" y="406" class="t" text-anchor="start">next: &lt;original command&gt;</text>
<path d="M 64 115 L 64 442" class="wire"/>
<path d="M 59 434 L 64 442 L 69 434 Z" class="head"/>
<rect x="24" y="442" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="461" r="8" class="badge"/>
<text x="44" y="465" class="badge-t" text-anchor="middle">2</text>
<text x="64" y="464" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="484" class="t" text-anchor="start">Plan the sync.</text>
<path d="M 424 454 L 438 454 L 438 489 L 480 489" class="wire-failure"/>
<path d="M 472 484 L 480 489 L 472 494 Z" class="head"/>
<rect x="480" y="442" width="330" height="94" rx="6" class="stop-failure"/>
<text x="492" y="460" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="478" class="t" text-anchor="start">A sync down finds the old index file of the</text>
<text x="492" y="494" class="t" text-anchor="start">store and needs plastic store sync up first,</text>
<text x="492" y="510" class="t" text-anchor="start">or an overwrite path names no file and no</text>
<text x="492" y="526" class="t" text-anchor="start">rows.</text>
<path d="M 424 468 L 432 468 L 432 607 L 480 607" class="wire-refusal"/>
<path d="M 472 602 L 480 607 L 472 612 Z" class="head"/>
<rect x="480" y="544" width="330" height="126" rx="6" class="stop-refusal"/>
<text x="492" y="562" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="580" class="t" text-anchor="start">Changed on both sides since the last print,</text>
<text x="492" y="596" class="t" text-anchor="start">nothing written. --overwrite PATH prints that</text>
<text x="492" y="612" class="t" text-anchor="start">record&#39;s rows over the file, --overwrite</text>
<text x="492" y="628" class="t" text-anchor="start">prints every record, --merge applies the</text>
<text x="492" y="644" class="t" text-anchor="start">one-sided changes and lists the rest. The</text>
<text x="492" y="660" class="t" text-anchor="start">records: &lt;conflicts&gt;.</text>
<path d="M 64 493 L 64 696" class="wire"/>
<path d="M 59 688 L 64 696 L 69 688 Z" class="head"/>
<rect x="24" y="696" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="715" r="8" class="badge"/>
<text x="44" y="719" class="badge-t" text-anchor="middle">3</text>
<text x="64" y="718" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="738" class="t" text-anchor="start">Apply the changes.</text>
<path d="M 64 747 L 64 773" class="wire"/>
<path d="M 59 765 L 64 773 L 69 765 Z" class="head"/>
<rect x="24" y="773" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="792" r="8" class="badge"/>
<text x="44" y="796" class="badge-t" text-anchor="middle">4</text>
<text x="64" y="795" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="815" class="t" text-anchor="start">Say what changed.</text>
<path d="M 424 785 L 438 785 L 438 820 L 480 820" class="wire-refusal"/>
<path d="M 472 815 L 480 820 L 472 825 Z" class="head"/>
<rect x="480" y="773" width="330" height="94" rx="6" class="stop-refusal"/>
<text x="492" y="791" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="809" class="t" text-anchor="start">Changed on both sides since the last print,</text>
<text x="492" y="825" class="t" text-anchor="start">left as they are. --overwrite PATH prints that</text>
<text x="492" y="841" class="t" text-anchor="start">record&#39;s rows over the file, --overwrite</text>
<text x="492" y="857" class="t" text-anchor="start">prints every record. The records: &lt;conflicts&gt;.</text>
<path d="M 424 799 L 432 799 L 432 906 L 480 906" class="wire-end"/>
<path d="M 472 901 L 480 906 L 472 911 Z" class="head"/>
<rect x="480" y="875" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="893" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="911" class="t" text-anchor="start">The files hold every row that changed.</text>
<text x="492" y="927" class="t" text-anchor="start">next: plastic next</text>
<rect x="24" y="967" width="14" height="14" rx="3" class="lane-code"/>
<text x="44" y="979" class="k" text-anchor="start">Code Workflow</text>
<rect x="140" y="967" width="14" height="14" rx="3" class="stop-failure"/>
<text x="160" y="979" class="k" text-anchor="start">Stops with a failure</text>
<rect x="276" y="967" width="14" height="14" rx="3" class="stop-refusal"/>
<text x="296" y="979" class="k" text-anchor="start">Stops for the owner</text>
<rect x="414" y="967" width="14" height="14" rx="3" class="stop-end"/>
<text x="434" y="979" class="k" text-anchor="start">Ends</text>
</svg>