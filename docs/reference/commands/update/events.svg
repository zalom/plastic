<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 1091" width="834" height="1091" role="img" xml:space="preserve">
<title>The events of one call of plastic update, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic update, from top to bottom</text>
<rect x="24" y="64" width="400" height="68" rx="6" class="lane-code"/>
<circle cx="44" cy="83" r="8" class="badge"/>
<text x="44" y="87" class="badge-t" text-anchor="middle">1</text>
<text x="64" y="86" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="106" class="t" text-anchor="start">Compare the installed version with the one a real</text>
<text x="64" y="123" class="t" text-anchor="start">run would install.</text>
<path d="M 424 76 L 438 76 L 438 95 L 480 95" class="wire-refusal"/>
<path d="M 472 90 L 480 95 L 472 100 Z" class="head"/>
<rect x="480" y="64" width="330" height="62" rx="6" class="stop-refusal"/>
<text x="492" y="82" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="100" class="t" text-anchor="start">Plastic is not installed under this home; run</text>
<text x="492" y="116" class="t" text-anchor="start">plastic install first.</text>
<path d="M 424 90 L 432 90 L 432 181 L 480 181" class="wire-failure"/>
<path d="M 472 176 L 480 181 L 472 186 Z" class="head"/>
<rect x="480" y="134" width="330" height="94" rx="6" class="stop-failure"/>
<text x="492" y="152" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="170" class="t" text-anchor="start">No release is newer than &lt;from&gt;, and a store</text>
<text x="492" y="186" class="t" text-anchor="start">came from unreleased code (&lt;unreleased&gt;);</text>
<text x="492" y="202" class="t" text-anchor="start">update again once a release holds that</text>
<text x="492" y="218" class="t" text-anchor="start">migration.</text>
<path d="M 64 132 L 64 254" class="wire"/>
<path d="M 59 246 L 64 254 L 69 246 Z" class="head"/>
<rect x="24" y="254" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="273" r="8" class="badge"/>
<text x="44" y="277" class="badge-t" text-anchor="middle">2</text>
<text x="64" y="276" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="296" class="t" text-anchor="start">Say what the update would do.</text>
<path d="M 424 285 L 480 285" class="wire-end"/>
<path d="M 472 280 L 480 285 L 472 290 Z" class="head"/>
<rect x="480" y="254" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="272" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="290" class="t" text-anchor="start">The preview changed no file.</text>
<text x="492" y="306" class="t" text-anchor="start">next: &lt;original command&gt;</text>
<path d="M 64 305 L 64 342" class="wire"/>
<path d="M 59 334 L 64 342 L 69 334 Z" class="head"/>
<rect x="24" y="342" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="361" r="8" class="badge"/>
<text x="44" y="365" class="badge-t" text-anchor="middle">3</text>
<text x="64" y="364" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="384" class="t" text-anchor="start">Check whether the running package is newer.</text>
<path d="M 64 393 L 64 419" class="wire"/>
<path d="M 59 411 L 64 419 L 69 411 Z" class="head"/>
<rect x="24" y="419" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="438" r="8" class="badge"/>
<text x="44" y="442" class="badge-t" text-anchor="middle">4</text>
<text x="64" y="441" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="461" class="t" text-anchor="start">Sync the newer package into the home.</text>
<path d="M 64 470 L 64 496" class="wire"/>
<path d="M 59 488 L 64 496 L 69 488 Z" class="head"/>
<rect x="24" y="496" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="515" r="8" class="badge"/>
<text x="44" y="519" class="badge-t" text-anchor="middle">5</text>
<text x="64" y="518" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="538" class="t" text-anchor="start">Bring the databases to the newest layout.</text>
<path d="M 64 547 L 64 573" class="wire"/>
<path d="M 59 565 L 64 573 L 69 565 Z" class="head"/>
<rect x="24" y="573" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="592" r="8" class="badge"/>
<text x="44" y="596" class="badge-t" text-anchor="middle">6</text>
<text x="64" y="595" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="615" class="t" text-anchor="start">Find a newer release on the chosen channel.</text>
<path d="M 424 614 L 432 614 L 432 620 L 480 620" class="wire-failure"/>
<path d="M 472 615 L 480 620 L 472 625 Z" class="head"/>
<rect x="480" y="573" width="330" height="94" rx="6" class="stop-failure"/>
<text x="492" y="591" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="609" class="t" text-anchor="start">No release is newer than &lt;active&gt;, and a store</text>
<text x="492" y="625" class="t" text-anchor="start">came from unreleased code (&lt;unreleased&gt;);</text>
<text x="492" y="641" class="t" text-anchor="start">update again once a release holds that</text>
<text x="492" y="657" class="t" text-anchor="start">migration.</text>
<path d="M 64 624 L 64 693" class="wire"/>
<path d="M 59 685 L 64 693 L 69 685 Z" class="head"/>
<rect x="24" y="693" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="712" r="8" class="badge"/>
<text x="44" y="716" class="badge-t" text-anchor="middle">7</text>
<text x="64" y="715" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="735" class="t" text-anchor="start">Download the newer release.</text>
<path d="M 424 705 L 450 705 L 450 724 L 480 724" class="wire-end"/>
<path d="M 472 719 L 480 724 L 472 729 Z" class="head"/>
<rect x="480" y="693" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="711" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="729" class="t" text-anchor="start">The home holds Plastic &lt;to&gt;.</text>
<text x="492" y="745" class="t" text-anchor="start">next: plastic version</text>
<path d="M 424 714 L 444 714 L 444 802 L 480 802" class="wire-end"/>
<path d="M 472 797 L 480 802 L 472 807 Z" class="head"/>
<rect x="480" y="763" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="781" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="799" class="t" text-anchor="start">Plastic &lt;release&gt; is downloaded and checked;</text>
<text x="492" y="815" class="t" text-anchor="start">this command installs it.</text>
<text x="492" y="831" class="t" text-anchor="start">next: &lt;command&gt;</text>
<path d="M 424 723 L 438 723 L 438 888 L 480 888" class="wire-end"/>
<path d="M 472 883 L 480 888 L 472 893 Z" class="head"/>
<rect x="480" y="849" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="867" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="885" class="t" text-anchor="start">Plastic &lt;active&gt; is the newest release on its</text>
<text x="492" y="901" class="t" text-anchor="start">channel.</text>
<text x="492" y="917" class="t" text-anchor="start">next: plastic version</text>
<path d="M 424 732 L 432 732 L 432 974 L 480 974" class="wire-end"/>
<path d="M 472 969 L 480 974 L 472 979 Z" class="head"/>
<rect x="480" y="935" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="953" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="971" class="t" text-anchor="start">Run the installer command above, then update</text>
<text x="492" y="987" class="t" text-anchor="start">again.</text>
<text x="492" y="1003" class="t" text-anchor="start">next: plastic update</text>
<rect x="24" y="1043" width="14" height="14" rx="3" class="lane-code"/>
<text x="44" y="1055" class="k" text-anchor="start">Code Workflow</text>
<rect x="140" y="1043" width="14" height="14" rx="3" class="stop-failure"/>
<text x="160" y="1055" class="k" text-anchor="start">Stops with a failure</text>
<rect x="276" y="1043" width="14" height="14" rx="3" class="stop-refusal"/>
<text x="296" y="1055" class="k" text-anchor="start">Stops for the owner</text>
<rect x="414" y="1043" width="14" height="14" rx="3" class="stop-end"/>
<text x="434" y="1055" class="k" text-anchor="start">Ends</text>
</svg>