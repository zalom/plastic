<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 995" width="834" height="995" role="img" xml:space="preserve">
<title>The events of one call of plastic update, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic update, from top to bottom</text>
<rect x="24" y="64" width="400" height="68" rx="6" class="lane-code"/>
<circle cx="44" cy="83" r="8" class="badge"/>
<text x="44" y="87" class="badge-t" text-anchor="middle">1</text>
<text x="64" y="86" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="106" class="t" text-anchor="start">Compare the installed version with the one a real</text>
<text x="64" y="123" class="t" text-anchor="start">run would install.</text>
<path d="M 424 95 L 480 95" class="wire-refusal"/>
<path d="M 472 90 L 480 95 L 472 100 Z" class="head"/>
<rect x="480" y="64" width="330" height="62" rx="6" class="stop-refusal"/>
<text x="492" y="82" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="100" class="t" text-anchor="start">Plastic is not installed under this home; run</text>
<text x="492" y="116" class="t" text-anchor="start">plastic install first.</text>
<path d="M 64 132 L 64 158" class="wire"/>
<path d="M 59 150 L 64 158 L 69 150 Z" class="head"/>
<rect x="24" y="158" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="177" r="8" class="badge"/>
<text x="44" y="181" class="badge-t" text-anchor="middle">2</text>
<text x="64" y="180" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="200" class="t" text-anchor="start">Say what the update would do.</text>
<path d="M 424 189 L 480 189" class="wire-end"/>
<path d="M 472 184 L 480 189 L 472 194 Z" class="head"/>
<rect x="480" y="158" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="176" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="194" class="t" text-anchor="start">The preview changed no file.</text>
<text x="492" y="210" class="t" text-anchor="start">next: &lt;original command&gt;</text>
<path d="M 64 209 L 64 246" class="wire"/>
<path d="M 59 238 L 64 246 L 69 238 Z" class="head"/>
<rect x="24" y="246" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="265" r="8" class="badge"/>
<text x="44" y="269" class="badge-t" text-anchor="middle">3</text>
<text x="64" y="268" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="288" class="t" text-anchor="start">Check whether the running package is newer.</text>
<path d="M 64 297 L 64 323" class="wire"/>
<path d="M 59 315 L 64 323 L 69 315 Z" class="head"/>
<rect x="24" y="323" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="342" r="8" class="badge"/>
<text x="44" y="346" class="badge-t" text-anchor="middle">4</text>
<text x="64" y="345" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="365" class="t" text-anchor="start">Sync the newer package into the home.</text>
<path d="M 64 374 L 64 400" class="wire"/>
<path d="M 59 392 L 64 400 L 69 392 Z" class="head"/>
<rect x="24" y="400" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="419" r="8" class="badge"/>
<text x="44" y="423" class="badge-t" text-anchor="middle">5</text>
<text x="64" y="422" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="442" class="t" text-anchor="start">Bring the databases to the newest layout.</text>
<path d="M 64 451 L 64 477" class="wire"/>
<path d="M 59 469 L 64 477 L 69 469 Z" class="head"/>
<rect x="24" y="477" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="496" r="8" class="badge"/>
<text x="44" y="500" class="badge-t" text-anchor="middle">6</text>
<text x="64" y="499" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="519" class="t" text-anchor="start">Find a newer release on the chosen channel.</text>
<path d="M 424 518 L 432 518 L 432 524 L 480 524" class="wire-failure"/>
<path d="M 472 519 L 480 524 L 472 529 Z" class="head"/>
<rect x="480" y="477" width="330" height="94" rx="6" class="stop-failure"/>
<text x="492" y="495" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="513" class="t" text-anchor="start">No release is newer than &lt;active&gt;, and a store</text>
<text x="492" y="529" class="t" text-anchor="start">came from unreleased code (&lt;unreleased&gt;);</text>
<text x="492" y="545" class="t" text-anchor="start">update again once a release holds that</text>
<text x="492" y="561" class="t" text-anchor="start">migration.</text>
<path d="M 64 528 L 64 597" class="wire"/>
<path d="M 59 589 L 64 597 L 69 589 Z" class="head"/>
<rect x="24" y="597" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="616" r="8" class="badge"/>
<text x="44" y="620" class="badge-t" text-anchor="middle">7</text>
<text x="64" y="619" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="639" class="t" text-anchor="start">Download the newer release.</text>
<path d="M 424 609 L 450 609 L 450 628 L 480 628" class="wire-end"/>
<path d="M 472 623 L 480 628 L 472 633 Z" class="head"/>
<rect x="480" y="597" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="615" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="633" class="t" text-anchor="start">The home holds Plastic &lt;to&gt;.</text>
<text x="492" y="649" class="t" text-anchor="start">next: plastic version</text>
<path d="M 424 618 L 444 618 L 444 706 L 480 706" class="wire-end"/>
<path d="M 472 701 L 480 706 L 472 711 Z" class="head"/>
<rect x="480" y="667" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="685" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="703" class="t" text-anchor="start">Plastic &lt;release&gt; is downloaded and checked;</text>
<text x="492" y="719" class="t" text-anchor="start">this command installs it.</text>
<text x="492" y="735" class="t" text-anchor="start">next: &lt;command&gt;</text>
<path d="M 424 627 L 438 627 L 438 792 L 480 792" class="wire-end"/>
<path d="M 472 787 L 480 792 L 472 797 Z" class="head"/>
<rect x="480" y="753" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="771" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="789" class="t" text-anchor="start">Plastic &lt;active&gt; is the newest release on its</text>
<text x="492" y="805" class="t" text-anchor="start">channel.</text>
<text x="492" y="821" class="t" text-anchor="start">next: plastic version</text>
<path d="M 424 636 L 432 636 L 432 878 L 480 878" class="wire-end"/>
<path d="M 472 873 L 480 878 L 472 883 Z" class="head"/>
<rect x="480" y="839" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="857" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="875" class="t" text-anchor="start">Run the installer command above, then update</text>
<text x="492" y="891" class="t" text-anchor="start">again.</text>
<text x="492" y="907" class="t" text-anchor="start">next: plastic update</text>
<rect x="24" y="947" width="14" height="14" rx="3" class="lane-code"/>
<text x="44" y="959" class="k" text-anchor="start">Code Workflow</text>
<rect x="140" y="947" width="14" height="14" rx="3" class="stop-failure"/>
<text x="160" y="959" class="k" text-anchor="start">Stops with a failure</text>
<rect x="276" y="947" width="14" height="14" rx="3" class="stop-refusal"/>
<text x="296" y="959" class="k" text-anchor="start">Stops for the owner</text>
<rect x="414" y="947" width="14" height="14" rx="3" class="stop-end"/>
<text x="434" y="959" class="k" text-anchor="start">Ends</text>
</svg>