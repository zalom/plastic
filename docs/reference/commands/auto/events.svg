<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 1094" width="834" height="1094" role="img" xml:space="preserve">
<title>The events of one call of plastic auto, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic auto, from top to bottom</text>
<rect x="24" y="64" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="83" r="8" class="badge"/>
<text x="44" y="87" class="badge-t" text-anchor="middle">1</text>
<text x="64" y="86" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="106" class="t" text-anchor="start">Forget what an earlier call picked.</text>
<path d="M 424 87 L 480 87" class="wire-failure"/>
<path d="M 472 82 L 480 87 L 472 92 Z" class="head"/>
<rect x="480" y="64" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="82" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="100" class="t" text-anchor="start">No roadmap &lt;id&gt;.</text>
<path d="M 64 115 L 64 141" class="wire"/>
<path d="M 59 133 L 64 141 L 69 133 Z" class="head"/>
<rect x="24" y="141" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="160" r="8" class="badge"/>
<text x="44" y="164" class="badge-t" text-anchor="middle">2</text>
<text x="64" y="163" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="183" class="t" text-anchor="start">Pick the intent to deliver.</text>
<path d="M 424 153 L 444 153 L 444 172 L 480 172" class="wire-end"/>
<path d="M 472 167 L 480 172 L 472 177 Z" class="head"/>
<rect x="480" y="141" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="159" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="177" class="t" text-anchor="start">Item &lt;ready id&gt; is ready.</text>
<text x="492" y="193" class="t" text-anchor="start">next: plastic roadmap open &lt;id&gt; &lt;ready id&gt;</text>
<path d="M 424 166 L 438 166 L 438 242 L 480 242" class="wire-end"/>
<path d="M 472 237 L 480 242 L 472 247 Z" class="head"/>
<rect x="480" y="211" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="229" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="247" class="t" text-anchor="start">Every item of &lt;id&gt; is done or dropped.</text>
<text x="492" y="263" class="t" text-anchor="start">next: plastic roadmap show &lt;id&gt;</text>
<path d="M 424 179 L 432 179 L 432 312 L 480 312" class="wire-end"/>
<path d="M 472 307 L 480 312 L 472 317 Z" class="head"/>
<rect x="480" y="281" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="299" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="317" class="t" text-anchor="start">No item of &lt;id&gt; is free to deliver yet.</text>
<text x="492" y="333" class="t" text-anchor="start">next: plastic roadmap show &lt;id&gt;</text>
<path d="M 64 192 L 64 369" class="wire"/>
<path d="M 59 361 L 64 369 L 69 361 Z" class="head"/>
<rect x="24" y="369" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="388" r="8" class="badge"/>
<text x="44" y="392" class="badge-t" text-anchor="middle">3</text>
<text x="64" y="391" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="411" class="t" text-anchor="start">Read the intent and its spec.</text>
<path d="M 424 381 L 462 381 L 462 392 L 480 392" class="wire-failure"/>
<path d="M 472 387 L 480 392 L 472 397 Z" class="head"/>
<rect x="480" y="369" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="387" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="405" class="t" text-anchor="start">No intent &lt;intent id&gt; in this store.</text>
<path d="M 424 386 L 456 386 L 456 446 L 480 446" class="wire-failure"/>
<path d="M 472 441 L 480 446 L 472 451 Z" class="head"/>
<rect x="480" y="423" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="441" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="459" class="t" text-anchor="start">Auto names no session; set PLASTIC_SESSION.</text>
<path d="M 424 391 L 450 391 L 450 500 L 480 500" class="wire-failure"/>
<path d="M 472 495 L 480 500 L 472 505 Z" class="head"/>
<rect x="480" y="477" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="495" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="513" class="t" text-anchor="start">The session of the call has ended.</text>
<path d="M 424 396 L 444 396 L 444 570 L 480 570" class="wire-failure"/>
<path d="M 472 565 L 480 570 L 472 575 Z" class="head"/>
<rect x="480" y="531" width="330" height="78" rx="6" class="stop-failure"/>
<text x="492" y="549" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="567" class="t" text-anchor="start">A closed intent cannot be armed; pick other</text>
<text x="492" y="583" class="t" text-anchor="start">work.</text>
<text x="492" y="599" class="t" text-anchor="start">next: plastic next</text>
<path d="M 424 401 L 438 401 L 438 648 L 480 648" class="wire-failure"/>
<path d="M 472 643 L 480 648 L 472 653 Z" class="head"/>
<rect x="480" y="617" width="330" height="62" rx="6" class="stop-failure"/>
<text x="492" y="635" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="653" class="t" text-anchor="start">The spec needs a done criterion.</text>
<text x="492" y="669" class="t" text-anchor="start">next: plastic intent spec &lt;intent id&gt;</text>
<path d="M 424 406 L 432 406 L 432 726 L 480 726" class="wire-refusal"/>
<path d="M 472 721 L 480 726 L 472 731 Z" class="head"/>
<rect x="480" y="687" width="330" height="78" rx="6" class="stop-refusal"/>
<text x="492" y="705" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="723" class="t" text-anchor="start">A decision of the spec is open, another live</text>
<text x="492" y="739" class="t" text-anchor="start">session holds the lock of the intent, or the</text>
<text x="492" y="755" class="t" text-anchor="start">intent has no go-ahead.</text>
<path d="M 64 420 L 64 791" class="wire"/>
<path d="M 59 783 L 64 791 L 69 783 Z" class="head"/>
<rect x="24" y="791" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="810" r="8" class="badge"/>
<text x="44" y="814" class="badge-t" text-anchor="middle">4</text>
<text x="64" y="813" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="833" class="t" text-anchor="start">Lock the intent and go in progress.</text>
<path d="M 64 842 L 64 868" class="wire"/>
<path d="M 59 860 L 64 868 L 69 860 Z" class="head"/>
<rect x="24" y="868" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="887" r="8" class="badge"/>
<text x="44" y="891" class="badge-t" text-anchor="middle">5</text>
<text x="64" y="890" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="910" class="t" text-anchor="start">Name the code worktree.</text>
<path d="M 424 880 L 438 880 L 438 907 L 480 907" class="wire-end"/>
<path d="M 472 902 L 480 907 L 472 912 Z" class="head"/>
<rect x="480" y="868" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="886" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="904" class="t" text-anchor="start">The worktree of intent &lt;intent id&gt; is not made</text>
<text x="492" y="920" class="t" text-anchor="start">yet.</text>
<text x="492" y="936" class="t" text-anchor="start">next: plastic auto &lt;intent id&gt;</text>
<path d="M 424 894 L 432 894 L 432 985 L 480 985" class="wire-end"/>
<path d="M 472 980 L 480 985 L 472 990 Z" class="head"/>
<rect x="480" y="954" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="972" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="990" class="t" text-anchor="start">Intent &lt;intent id&gt; is in progress.</text>
<text x="492" y="1006" class="t" text-anchor="start">next: plastic intent brief &lt;intent id&gt;</text>
<rect x="24" y="1046" width="14" height="14" rx="3" class="lane-code"/>
<text x="44" y="1058" class="k" text-anchor="start">Code Workflow</text>
<rect x="140" y="1046" width="14" height="14" rx="3" class="stop-failure"/>
<text x="160" y="1058" class="k" text-anchor="start">Stops with a failure</text>
<rect x="298" y="1046" width="14" height="14" rx="3" class="stop-refusal"/>
<text x="318" y="1058" class="k" text-anchor="start">Stops for the owner</text>
<rect x="450" y="1046" width="14" height="14" rx="3" class="stop-end"/>
<text x="470" y="1058" class="k" text-anchor="start">Ends</text>
</svg>