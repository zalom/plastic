<path d="M 221 378 L 226 386 L 231 378 Z" class="head"/>
<rect x="16" y="386" width="420" height="45" rx="6" class="card"/>
<text x="26" y="401" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="401" class="tm tag-muted" text-anchor="end">auto.rb:76</text>
<text x="26" y="418" class="tm" text-anchor="start">passes when context.problem.nil?</text>
