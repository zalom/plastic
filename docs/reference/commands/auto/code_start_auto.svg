<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 659" width="760" height="659" role="img" xml:space="preserve">
<title>How StartAuto runs in plastic auto</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="16" y="22" class="tb" text-anchor="start">StartAuto</text>
<text x="436" y="22" class="tm tag-muted" text-anchor="end">start_auto.rb:13</text>
<rect x="16" y="34" width="420" height="45" rx="6" class="card"/>
<text x="26" y="49" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="49" class="tm tag-muted" text-anchor="end">start_auto.rb:18</text>
<text x="26" y="66" class="t" text-anchor="start">read the intent and its spec</text>
<path d="M 226 79 L 226 89" class="wire"/>
<path d="M 221 81 L 226 89 L 231 81 Z" class="head"/>
<rect x="16" y="89" width="420" height="56" rx="6" class="card"/>
<text x="26" y="104" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="104" class="tm tag-muted" text-anchor="end">start_auto.rb:59</text>
<text x="26" y="121" class="tm" text-anchor="start">passes when !context.intent.nil?</text>
<path d="M 436 107 L 464 107" class="wire-failure"/>
<path d="M 456 102 L 464 107 L 456 112 Z" class="head"/>
<rect x="466" y="89" width="270" height="56" rx="6" class="stop-failure"/>
<text x="476" y="104" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="120" class="tm" text-anchor="start">no intent %{intent_id} in this</text>
<text x="476" y="134" class="tm" text-anchor="start">store</text>
<path d="M 226 145 L 226 155" class="wire"/>
<path d="M 221 147 L 226 155 L 231 147 Z" class="head"/>
<rect x="16" y="155" width="420" height="45" rx="6" class="card"/>
<text x="26" y="170" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="170" class="tm tag-muted" text-anchor="end">start_auto.rb:60</text>
<text x="26" y="187" class="tm" text-anchor="start">passes when !context.session.nil?</text>
<path d="M 436 173 L 464 173" class="wire-failure"/>
<path d="M 456 168 L 464 173 L 456 178 Z" class="head"/>
<rect x="466" y="155" width="270" height="42" rx="6" class="stop-failure"/>
<text x="476" y="170" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="186" class="tm" text-anchor="start">plastic auto names no session</text>
<path d="M 226 200 L 226 210" class="wire"/>
<path d="M 221 202 L 226 210 L 231 202 Z" class="head"/>
<rect x="16" y="210" width="420" height="45" rx="6" class="card"/>
<text x="26" y="225" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="225" class="tm tag-muted" text-anchor="end">start_auto.rb:61</text>
<text x="26" y="242" class="tm" text-anchor="start">passes when context.closed_problem.nil?</text>
<path d="M 436 228 L 464 228" class="wire-failure"/>
<path d="M 456 223 L 464 228 L 456 233 Z" class="head"/>
<rect x="466" y="210" width="270" height="42" rx="6" class="stop-failure"/>
<text x="476" y="225" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="241" class="tm" text-anchor="start">%{closed_problem}</text>
<path d="M 226 255 L 226 265" class="wire"/>
<path d="M 221 257 L 226 265 L 231 257 Z" class="head"/>
<rect x="16" y="265" width="420" height="45" rx="6" class="card"/>
<text x="26" y="280" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="280" class="tm tag-muted" text-anchor="end">start_auto.rb:63</text>
<text x="26" y="297" class="tm" text-anchor="start">passes when context.spec_problem.nil?</text>
<path d="M 436 283 L 464 283" class="wire-failure"/>
<path d="M 456 278 L 464 283 L 456 288 Z" class="head"/>
<rect x="466" y="265" width="270" height="42" rx="6" class="stop-failure"/>
<text x="476" y="280" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="296" class="tm" text-anchor="start">%{spec_problem}</text>
<path d="M 226 310 L 226 320" class="wire"/>
<path d="M 221 312 L 226 320 L 231 312 Z" class="head"/>
<rect x="16" y="320" width="420" height="45" rx="6" class="card"/>
<text x="26" y="335" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="335" class="tm tag-muted" text-anchor="end">start_auto.rb:65</text>
<text x="26" y="352" class="tm" text-anchor="start">passes when context.problem.nil?</text>
<path d="M 436 338 L 464 338" class="wire-refusal"/>
<path d="M 456 333 L 464 338 L 456 343 Z" class="head"/>
<rect x="466" y="320" width="270" height="42" rx="6" class="stop-refusal"/>
<text x="476" y="335" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="351" class="tm" text-anchor="start">%{problem}</text>
<path d="M 226 365 L 226 375" class="wire"/>
<path d="M 221 367 L 226 375 L 231 367 Z" class="head"/>
<rect x="16" y="375" width="420" height="129" rx="6" class="card"/>
<text x="26" y="390" class="tag tag-muted" text-anchor="start">STEP</text>
<text x="426" y="390" class="tm tag-muted" text-anchor="end">start_auto.rb:75</text>
<text x="26" y="407" class="t" text-anchor="start">take the lock and go active</text>
<text x="26" y="422" class="tm" text-anchor="start">done when def self.delivery_started?(context)</text>
<text x="26" y="436" class="tm" text-anchor="start">retrieval = context.retrieval intent_id =</text>
<text x="26" y="450" class="tm" text-anchor="start">context.intent_id lock = retrieval.lock(intent_id)</text>
<text x="26" y="464" class="tm" text-anchor="start">retrieval.intent(intent_id).status == &quot;active&quot; &amp;&amp;</text>
<text x="26" y="478" class="tm" text-anchor="start">lock&amp;.session_id == context.session &amp;&amp; lock.mode ==</text>
<text x="26" y="492" class="tm" text-anchor="start">&quot;auto&quot; &amp;&amp; lock.live? end</text>
<path d="M 436 393 L 464 393" class="wire-failure"/>
<path d="M 456 388 L 464 393 L 456 398 Z" class="head"/>
<rect x="466" y="375" width="270" height="56" rx="6" class="stop-failure"/>
<text x="476" y="390" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1, FAILED</text>
<text x="476" y="406" class="tm" text-anchor="start">the step ran and its done</text>
<text x="476" y="420" class="tm" text-anchor="start">check still fails</text>
<path d="M 226 504 L 226 514" class="wire"/>
<path d="M 221 506 L 226 514 L 231 506 Z" class="head"/>
<rect x="16" y="514" width="420" height="45" rx="6" class="card"/>
<text x="26" y="529" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="529" class="tm tag-muted" text-anchor="end">start_auto.rb:80</text>
<text x="26" y="546" class="t" text-anchor="start">name the code worktree</text>
<path d="M 226 559 L 226 569" class="wire"/>
<path d="M 221 561 L 226 569 L 231 561 Z" class="head"/>
<text x="16" y="581" class="tag tag-muted" text-anchor="start">ENDS ON</text>
<rect x="16" y="589" width="300" height="56" rx="6" class="card"/>
<text x="26" y="605" class="tm" text-anchor="start">:done</text>
<text x="26" y="621" class="tm tag-muted" text-anchor="start">always</text>
<path d="M 316 605 L 352 605" class="wire"/>
<path d="M 344 600 L 352 605 L 344 610 Z" class="head"/>
<rect x="352" y="589" width="392" height="56" rx="6" class="end"/>
<text x="362" y="606" class="t" text-anchor="start">the call finishes, exit 0</text>
<text x="362" y="620" class="t" text-anchor="start">next: plastic intent brief %{intent_id}</text>
<text x="362" y="634" class="t" text-anchor="start">because: intent %{intent_id} is active</text>
</svg>