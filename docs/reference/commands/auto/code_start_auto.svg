<text x="476" y="472" class="tm" text-anchor="start">the step ran and its done</text>
<text x="476" y="486" class="tm" text-anchor="start">check still fails</text>
<path d="M 226 570 L 226 580" class="wire"/>
<path d="M 221 572 L 226 580 L 231 572 Z" class="head"/>
<rect x="16" y="580" width="420" height="45" rx="6" class="card"/>
<text x="26" y="595" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="595" class="tm tag-muted" text-anchor="end">auto.rb:91</text>
<text x="26" y="612" class="t" text-anchor="start">name the code worktree</text>
