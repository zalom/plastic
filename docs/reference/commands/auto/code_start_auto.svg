<path d="M 344 666 L 352 671 L 344 676 Z" class="head"/>
<rect x="352" y="655" width="392" height="70" rx="6" class="end"/>
<text x="362" y="672" class="t" text-anchor="start">the call finishes, exit 0</text>
<text x="362" y="686" class="t" text-anchor="start">next: plastic auto %{intent_id}</text>
<text x="362" y="700" class="t" text-anchor="start">because: the worktree of intent %{intent_id} is</text>
<text x="362" y="714" class="t" text-anchor="start">not made yet</text>
<rect x="16" y="733" width="300" height="56" rx="6" class="card"/>
<text x="26" y="749" class="tm" text-anchor="start">:done</text>
<text x="26" y="765" class="tm tag-muted" text-anchor="start">otherwise</text>
