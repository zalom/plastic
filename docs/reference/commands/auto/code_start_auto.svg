<text x="476" y="417" class="tm" text-anchor="start">%{problem}</text>
<path d="M 226 431 L 226 441" class="wire"/>
<path d="M 221 433 L 226 441 L 231 433 Z" class="head"/>
<rect x="16" y="441" width="420" height="129" rx="6" class="card"/>
<text x="26" y="456" class="tag tag-muted" text-anchor="start">STEP</text>
<text x="426" y="456" class="tm tag-muted" text-anchor="end">auto.rb:86</text>
<text x="26" y="473" class="t" text-anchor="start">lock the intent and go in progress</text>
<text x="26" y="488" class="tm" text-anchor="start">done when def self.delivery_started?(context)</text>
<text x="26" y="502" class="tm" text-anchor="start">retrieval = context.retrieval intent_id =</text>
<text x="26" y="516" class="tm" text-anchor="start">context.intent_id lock = retrieval.lock(intent_id)</text>
<text x="26" y="530" class="tm" text-anchor="start">retrieval.intent(intent_id).status == &quot;in_progress&quot;</text>
<text x="26" y="544" class="tm" text-anchor="start">&amp;&amp; lock&amp;.session_id == context.session &amp;&amp; lock.mode</text>
<text x="26" y="558" class="tm" text-anchor="start">== &quot;auto&quot; &amp;&amp; retrieval.liveness(lock).live? end</text>
<path d="M 436 459 L 464 459" class="wire-failure"/>
<path d="M 456 454 L 464 459 L 456 464 Z" class="head"/>
