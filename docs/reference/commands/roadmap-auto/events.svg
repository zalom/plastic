<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 1250" width="834" height="1250" role="img" xml:space="preserve">
<title>The events of one call of plastic roadmap auto, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic roadmap auto, from top to bottom</text>
<rect x="24" y="64" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="83" r="8" class="badge"/>
<text x="44" y="87" class="badge-t" text-anchor="middle">1</text>
<text x="64" y="86" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="106" class="t" text-anchor="start">Forget what an earlier call picked.</text>
<path d="M 424 87 L 480 87" class="wire-failure"/>
<path d="M 472 82 L 480 87 L 472 92 Z" class="head"/>
<rect x="480" y="64" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="82" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="100" class="t" text-anchor="start">No roadmap &lt;slug&gt;.</text>
<path d="M 64 115 L 64 141" class="wire"/>
<path d="M 59 133 L 64 141 L 69 133 Z" class="head"/>
<rect x="24" y="141" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="160" r="8" class="badge"/>
<text x="44" y="164" class="badge-t" text-anchor="middle">2</text>
<text x="64" y="163" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="183" class="t" text-anchor="start">Pick the item to deliver.</text>
<path d="M 424 153 L 438 153 L 438 172 L 480 172" class="wire-end"/>
<path d="M 472 167 L 480 172 L 472 177 Z" class="head"/>
<rect x="480" y="141" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="159" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="177" class="t" text-anchor="start">Every item of &lt;slug&gt; is done or dropped.</text>
<text x="492" y="193" class="t" text-anchor="start">next: plastic roadmap show &lt;slug&gt;</text>
<path d="M 424 167 L 432 167 L 432 242 L 480 242" class="wire-end"/>
<path d="M 472 237 L 480 242 L 472 247 Z" class="head"/>
<rect x="480" y="211" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="229" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="247" class="t" text-anchor="start">No item of &lt;slug&gt; is free to deliver yet.</text>
<text x="492" y="263" class="t" text-anchor="start">next: plastic roadmap auto &lt;slug&gt;</text>
<path d="M 64 192 L 64 299" class="wire"/>
<path d="M 59 291 L 64 299 L 69 291 Z" class="head"/>
<rect x="24" y="299" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="318" r="8" class="badge"/>
<text x="44" y="322" class="badge-t" text-anchor="middle">3</text>
<text x="64" y="321" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="341" class="t" text-anchor="start">Forget a stop of an earlier call.</text>
<path d="M 64 350 L 64 376" class="wire"/>
<path d="M 59 368 L 64 376 L 69 368 Z" class="head"/>
<rect x="24" y="376" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="395" r="8" class="badge"/>
<text x="44" y="399" class="badge-t" text-anchor="middle">4</text>
<text x="64" y="398" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="418" class="t" text-anchor="start">Open the item&#39;s intent.</text>
<path d="M 424 388 L 438 388 L 438 399 L 480 399" class="wire-failure"/>
<path d="M 472 394 L 480 399 L 472 404 Z" class="head"/>
<rect x="480" y="376" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="394" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="412" class="t" text-anchor="start">The roadmap has no such item.</text>
<path d="M 424 402 L 432 402 L 432 461 L 480 461" class="wire-refusal"/>
<path d="M 472 456 L 480 461 L 472 466 Z" class="head"/>
<rect x="480" y="430" width="330" height="62" rx="6" class="stop-refusal"/>
<text x="492" y="448" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="466" class="t" text-anchor="start">The item already has an intent, or a needed</text>
<text x="492" y="482" class="t" text-anchor="start">item is not done yet.</text>
<path d="M 64 427 L 64 518" class="wire"/>
<path d="M 59 510 L 64 518 L 69 510 Z" class="head"/>
<rect x="24" y="518" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="537" r="8" class="badge"/>
<text x="44" y="541" class="badge-t" text-anchor="middle">5</text>
<text x="64" y="540" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="560" class="t" text-anchor="start">Say what was opened.</text>
<path d="M 64 569 L 64 595" class="wire"/>
<path d="M 59 587 L 64 595 L 69 587 Z" class="head"/>
<rect x="24" y="595" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="614" r="8" class="badge"/>
<text x="44" y="618" class="badge-t" text-anchor="middle">6</text>
<text x="64" y="617" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="637" class="t" text-anchor="start">Read the intent and its spec.</text>
<path d="M 424 607 L 450 607 L 450 618 L 480 618" class="wire-failure"/>
<path d="M 472 613 L 480 618 L 472 623 Z" class="head"/>
<rect x="480" y="595" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="613" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="631" class="t" text-anchor="start">No intent &lt;intent id&gt; in this store.</text>
<path d="M 424 616 L 444 616 L 444 680 L 480 680" class="wire-failure"/>
<path d="M 472 675 L 480 680 L 472 685 Z" class="head"/>
<rect x="480" y="649" width="330" height="62" rx="6" class="stop-failure"/>
<text x="492" y="667" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="685" class="t" text-anchor="start">&lt;start words&gt; names no session; set</text>
<text x="492" y="701" class="t" text-anchor="start">PLASTIC_SESSION.</text>
<path d="M 424 625 L 438 625 L 438 742 L 480 742" class="wire-failure"/>
<path d="M 472 737 L 480 742 L 472 747 Z" class="head"/>
<rect x="480" y="719" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="737" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="755" class="t" text-anchor="start">The session of the call has ended.</text>
<path d="M 424 634 L 432 634 L 432 804 L 480 804" class="wire-failure"/>
<path d="M 472 799 L 480 804 L 472 809 Z" class="head"/>
<rect x="480" y="773" width="330" height="62" rx="6" class="stop-failure"/>
<text x="492" y="791" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="809" class="t" text-anchor="start">A closed intent cannot start; pick other work.</text>
<text x="492" y="825" class="t" text-anchor="start">next: plastic next</text>
<path d="M 64 646 L 64 861" class="wire"/>
<path d="M 59 853 L 64 861 L 69 853 Z" class="head"/>
<rect x="24" y="861" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="880" r="8" class="badge"/>
<text x="44" y="884" class="badge-t" text-anchor="middle">7</text>
<text x="64" y="883" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="903" class="t" text-anchor="start">Go in progress.</text>
<path d="M 64 912 L 64 938" class="wire"/>
<path d="M 59 930 L 64 938 L 69 930 Z" class="head"/>
<rect x="24" y="938" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="957" r="8" class="badge"/>
<text x="44" y="961" class="badge-t" text-anchor="middle">8</text>
<text x="64" y="960" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="980" class="t" text-anchor="start">Name the code worktree.</text>
<path d="M 424 950 L 444 950 L 444 977 L 480 977" class="wire-end"/>
<path d="M 472 972 L 480 977 L 472 982 Z" class="head"/>
<rect x="480" y="938" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="956" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="974" class="t" text-anchor="start">The worktree of intent &lt;intent id&gt; is not made</text>
<text x="492" y="990" class="t" text-anchor="start">yet.</text>
<text x="492" y="1006" class="t" text-anchor="start">next: &lt;start command&gt; &lt;intent id&gt;</text>
<path d="M 424 963 L 438 963 L 438 1063 L 480 1063" class="wire-end"/>
<path d="M 472 1058 L 480 1063 L 472 1068 Z" class="head"/>
<rect x="480" y="1024" width="330" height="78" rx="6" class="stop-end"/>
<text x="492" y="1042" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="1060" class="t" text-anchor="start">The spec names no done criterion, has an open</text>
<text x="492" y="1076" class="t" text-anchor="start">decision, or has no go-ahead.</text>
<text x="492" y="1092" class="t" text-anchor="start">next: plastic intent spec &lt;intent id&gt;</text>
<path d="M 424 976 L 432 976 L 432 1141 L 480 1141" class="wire-end"/>
<path d="M 472 1136 L 480 1141 L 472 1146 Z" class="head"/>
<rect x="480" y="1110" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="1128" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="1146" class="t" text-anchor="start">Intent &lt;intent id&gt; is in progress.</text>
<text x="492" y="1162" class="t" text-anchor="start">next: plastic intent brief &lt;intent id&gt;</text>
<rect x="24" y="1202" width="14" height="14" rx="3" class="lane-code"/>
<text x="44" y="1214" class="k" text-anchor="start">Code Workflow</text>
<rect x="140" y="1202" width="14" height="14" rx="3" class="stop-failure"/>
<text x="160" y="1214" class="k" text-anchor="start">Stops with a failure</text>
<rect x="276" y="1202" width="14" height="14" rx="3" class="stop-refusal"/>
<text x="296" y="1214" class="k" text-anchor="start">Stops for the owner</text>
<rect x="414" y="1202" width="14" height="14" rx="3" class="stop-end"/>
<text x="434" y="1214" class="k" text-anchor="start">Ends</text>
</svg>