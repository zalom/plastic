<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 992" width="834" height="992" role="img" xml:space="preserve">
<title>The workflows of one call of plastic roadmap auto, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic roadmap auto: its workflows and its endings</text>
<rect x="290" y="56" width="254" height="100" rx="6" class="lane-code"/>
<text x="302" y="76" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="302" y="96" class="t" text-anchor="start">Picks the roadmap item to</text>
<text x="302" y="113" class="t" text-anchor="start">deliver: the first free item</text>
<text x="302" y="130" class="t" text-anchor="start">with an intent to start, or the</text>
<text x="302" y="147" class="t" text-anchor="start">first ready item to open.</text>
<rect x="24" y="56" width="222" height="100" rx="6" class="stop-end"/>
<text x="36" y="76" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="36" y="96" class="t" text-anchor="start">Every item of &lt;slug&gt; is</text>
<text x="36" y="113" class="t" text-anchor="start">done or dropped.</text>
<text x="36" y="130" class="t" text-anchor="start">next: plastic roadmap show</text>
<text x="36" y="147" class="t" text-anchor="start">&lt;slug&gt;</text>
<rect x="24" y="164" width="222" height="117" rx="6" class="stop-end"/>
<text x="36" y="184" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="36" y="204" class="t" text-anchor="start">No item of &lt;slug&gt; is free</text>
<text x="36" y="221" class="t" text-anchor="start">to deliver yet; it waits on</text>
<text x="36" y="238" class="t" text-anchor="start">&lt;waiting&gt;.</text>
<text x="36" y="255" class="t" text-anchor="start">next: plastic roadmap show</text>
<text x="36" y="272" class="t" text-anchor="start">&lt;slug&gt;</text>
<path d="M 290 106 L 268 106" class="wire-end"/>
<path d="M 268 106 L 268 222" class="wire-end"/>
<path d="M 268 106 L 246 106" class="wire-end"/>
<path d="M 254 101 L 246 106 L 254 111 Z" class="head"/>
<path d="M 268 222 L 246 222" class="wire-end"/>
<path d="M 254 217 L 246 222 L 254 227 Z" class="head"/>
<rect x="588" y="56" width="222" height="66" rx="6" class="stop-failure"/>
<text x="600" y="76" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="600" y="96" class="t" text-anchor="start">A check fails. The events</text>
<text x="600" y="113" class="t" text-anchor="start">below show each check.</text>
<path d="M 544 106 L 588 106" class="wire-failure"/>
<path d="M 580 101 L 588 106 L 580 111 Z" class="head"/>
<path d="M 417 156 L 417 311 L 417 311 L 417 319" class="wire"/>
<text x="417" y="333" class="k" text-anchor="middle">an item of &lt;slug&gt; in flight is</text>
<text x="417" y="347" class="k" text-anchor="middle">free to deliver or item &lt;item id&gt;</text>
<text x="417" y="361" class="k" text-anchor="middle">of &lt;slug&gt; is ready</text>
<path d="M 417 371 L 417 385" class="wire"/>
<path d="M 412 377 L 417 385 L 422 377 Z" class="head"/>
<rect x="290" y="385" width="254" height="100" rx="6" class="lane-code"/>
<text x="302" y="405" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="302" y="425" class="t" text-anchor="start">Opens a ready roadmap item&#39;s</text>
<text x="302" y="442" class="t" text-anchor="start">intent with its spec and links</text>
<text x="302" y="459" class="t" text-anchor="start">it to the roadmap; an intent</text>
<text x="302" y="476" class="t" text-anchor="start">already named opens nothing.</text>
<rect x="588" y="385" width="222" height="100" rx="6" class="stop-refusal"/>
<text x="600" y="405" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 1 OR 3</text>
<text x="600" y="425" class="t" text-anchor="start">A check fails or the step</text>
<text x="600" y="442" class="t" text-anchor="start">belongs to the owner. The</text>
<text x="600" y="459" class="t" text-anchor="start">events below show each</text>
<text x="600" y="476" class="t" text-anchor="start">check.</text>
<path d="M 544 435 L 588 435" class="wire-refusal"/>
<path d="M 580 430 L 588 435 L 580 440 Z" class="head"/>
<path d="M 417 485 L 417 507 L 417 507 L 417 515" class="wire"/>
<text x="417" y="529" class="k" text-anchor="middle"></text>
<path d="M 417 539 L 417 553" class="wire"/>
<path d="M 412 545 L 417 553 L 422 545 Z" class="head"/>
<rect x="290" y="553" width="254" height="66" rx="6" class="lane-code"/>
<text x="302" y="573" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="302" y="593" class="t" text-anchor="start">Starts the intent: it goes in</text>
<text x="302" y="610" class="t" text-anchor="start">progress and names its worktree.</text>
<rect x="588" y="553" width="222" height="66" rx="6" class="stop-failure"/>
<text x="600" y="573" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="600" y="593" class="t" text-anchor="start">A check fails. The events</text>
<text x="600" y="610" class="t" text-anchor="start">below show each check.</text>
<path d="M 544 586 L 588 586" class="wire-failure"/>
<path d="M 580 581 L 588 586 L 580 591 Z" class="head"/>
<path d="M 417 619 L 417 645" class="wire"/>
<path d="M 412 637 L 417 645 L 422 637 Z" class="head"/>
<rect x="290" y="645" width="254" height="100" rx="6" class="stop-end"/>
<text x="302" y="665" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="302" y="685" class="t" text-anchor="start">The worktree of intent &lt;intent</text>
<text x="302" y="702" class="t" text-anchor="start">id&gt; is not made yet.</text>
<text x="302" y="719" class="t" text-anchor="start">next: &lt;start command&gt; &lt;intent</text>
<text x="302" y="736" class="t" text-anchor="start">id&gt;</text>
<rect x="290" y="753" width="254" height="117" rx="6" class="stop-end"/>
<text x="302" y="773" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="302" y="793" class="t" text-anchor="start">The spec names no done</text>
<text x="302" y="810" class="t" text-anchor="start">criterion, has an open</text>
<text x="302" y="827" class="t" text-anchor="start">decision, or has no go-ahead.</text>
<text x="302" y="844" class="t" text-anchor="start">next: plastic intent spec</text>
<text x="302" y="861" class="t" text-anchor="start">&lt;intent id&gt;</text>
<rect x="290" y="878" width="254" height="100" rx="6" class="stop-end"/>
<text x="302" y="898" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="302" y="918" class="t" text-anchor="start">Intent &lt;intent id&gt; is in</text>
<text x="302" y="935" class="t" text-anchor="start">progress.</text>
<text x="302" y="952" class="t" text-anchor="start">next: plastic intent brief</text>
<text x="302" y="969" class="t" text-anchor="start">&lt;intent id&gt;</text>
</svg>