<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 1196" width="834" height="1196" role="img" xml:space="preserve">
<title>The events of one call of plastic node claim, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic node claim, from top to bottom</text>
<rect x="24" y="64" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="83" r="8" class="badge"/>
<text x="44" y="87" class="badge-t" text-anchor="middle">1</text>
<text x="64" y="86" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="106" class="t" text-anchor="start">Find the intent.</text>
<path d="M 424 76 L 438 76 L 438 87 L 480 87" class="wire-failure"/>
<path d="M 472 82 L 480 87 L 472 92 Z" class="head"/>
<rect x="480" y="64" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="82" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="100" class="t" text-anchor="start">No intent &lt;intent id&gt; in this store.</text>
<path d="M 424 90 L 432 90 L 432 149 L 480 149" class="wire-failure"/>
<path d="M 472 144 L 480 149 L 472 154 Z" class="head"/>
<rect x="480" y="118" width="330" height="62" rx="6" class="stop-failure"/>
<text x="492" y="136" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="154" class="t" text-anchor="start">Node claim names no session; set</text>
<text x="492" y="170" class="t" text-anchor="start">PLASTIC_SESSION.</text>
<path d="M 64 115 L 64 206" class="wire"/>
<path d="M 59 198 L 64 206 L 69 198 Z" class="head"/>
<rect x="24" y="206" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="225" r="8" class="badge"/>
<text x="44" y="229" class="badge-t" text-anchor="middle">2</text>
<text x="64" y="228" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="248" class="t" text-anchor="start">Check the agent against PLASTIC_AGENT.</text>
<path d="M 424 218 L 444 218 L 444 237 L 480 237" class="wire-failure"/>
<path d="M 472 232 L 480 237 L 472 242 Z" class="head"/>
<rect x="480" y="206" width="330" height="62" rx="6" class="stop-failure"/>
<text x="492" y="224" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="242" class="t" text-anchor="start">The claim names another agent than</text>
<text x="492" y="258" class="t" text-anchor="start">PLASTIC_AGENT.</text>
<path d="M 424 231 L 438 231 L 438 315 L 480 315" class="wire-refusal"/>
<path d="M 472 310 L 480 315 L 472 320 Z" class="head"/>
<rect x="480" y="276" width="330" height="78" rx="6" class="stop-refusal"/>
<text x="492" y="294" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="312" class="t" text-anchor="start">A node of a closed intent is never claimed;</text>
<text x="492" y="328" class="t" text-anchor="start">pick other work.</text>
<text x="492" y="344" class="t" text-anchor="start">next: plastic next</text>
<path d="M 424 244 L 432 244 L 432 401 L 480 401" class="wire-refusal"/>
<path d="M 472 396 L 480 401 L 472 406 Z" class="head"/>
<rect x="480" y="362" width="330" height="78" rx="6" class="stop-refusal"/>
<text x="492" y="380" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="398" class="t" text-anchor="start">A node is claimed only in an intent in</text>
<text x="492" y="414" class="t" text-anchor="start">progress.</text>
<text x="492" y="430" class="t" text-anchor="start">next: plastic intent start &lt;intent id&gt;</text>
<path d="M 64 257 L 64 466" class="wire"/>
<path d="M 59 458 L 64 466 L 69 458 Z" class="head"/>
<rect x="24" y="466" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="485" r="8" class="badge"/>
<text x="44" y="489" class="badge-t" text-anchor="middle">3</text>
<text x="64" y="488" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="508" class="t" text-anchor="start">Check the go-ahead.</text>
<path d="M 424 489 L 480 489" class="wire-refusal"/>
<path d="M 472 484 L 480 489 L 472 494 Z" class="head"/>
<rect x="480" y="466" width="330" height="46" rx="6" class="stop-refusal"/>
<text x="492" y="484" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="502" class="t" text-anchor="start">The intent has no go-ahead.</text>
<path d="M 64 517 L 64 543" class="wire"/>
<path d="M 59 535 L 64 543 L 69 535 Z" class="head"/>
<rect x="24" y="543" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="562" r="8" class="badge"/>
<text x="44" y="566" class="badge-t" text-anchor="middle">4</text>
<text x="64" y="565" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="585" class="t" text-anchor="start">Check the graph before the first claim.</text>
<path d="M 424 582 L 480 582" class="wire-refusal"/>
<path d="M 472 577 L 480 582 L 472 587 Z" class="head"/>
<rect x="480" y="543" width="330" height="78" rx="6" class="stop-refusal"/>
<text x="492" y="561" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="579" class="t" text-anchor="start">A loop or a need on a removed node stops the</text>
<text x="492" y="595" class="t" text-anchor="start">first claim; repair it, then claim again.</text>
<text x="492" y="611" class="t" text-anchor="start">next: plastic graph check &lt;intent id&gt;</text>
<path d="M 64 594 L 64 647" class="wire"/>
<path d="M 59 639 L 64 647 L 69 639 Z" class="head"/>
<rect x="24" y="647" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="666" r="8" class="badge"/>
<text x="44" y="670" class="badge-t" text-anchor="middle">5</text>
<text x="64" y="669" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="689" class="t" text-anchor="start">Check the output of the needed nodes.</text>
<path d="M 424 688 L 432 688 L 432 694 L 480 694" class="wire-failure"/>
<path d="M 472 689 L 480 694 L 472 699 Z" class="head"/>
<rect x="480" y="647" width="330" height="94" rx="6" class="stop-failure"/>
<text x="492" y="665" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="683" class="t" text-anchor="start">A needed node holds output that is not JSON,</text>
<text x="492" y="699" class="t" text-anchor="start">so no packet can be built; nothing was</text>
<text x="492" y="715" class="t" text-anchor="start">claimed.</text>
<text x="492" y="731" class="t" text-anchor="start">next: plastic graph check &lt;intent id&gt;</text>
<path d="M 64 698 L 64 767" class="wire"/>
<path d="M 59 759 L 64 767 L 69 759 Z" class="head"/>
<rect x="24" y="767" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="786" r="8" class="badge"/>
<text x="44" y="790" class="badge-t" text-anchor="middle">6</text>
<text x="64" y="789" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="809" class="t" text-anchor="start">Forget a refusal of an earlier call.</text>
<path d="M 64 818 L 64 844" class="wire"/>
<path d="M 59 836 L 64 844 L 69 836 Z" class="head"/>
<rect x="24" y="844" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="863" r="8" class="badge"/>
<text x="44" y="867" class="badge-t" text-anchor="middle">7</text>
<text x="64" y="866" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="886" class="t" text-anchor="start">Claim the node.</text>
<path d="M 424 856 L 444 856 L 444 875 L 480 875" class="wire-refusal"/>
<path d="M 472 870 L 480 875 L 472 880 Z" class="head"/>
<rect x="480" y="844" width="330" height="62" rx="6" class="stop-refusal"/>
<text x="492" y="862" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="880" class="t" text-anchor="start">The node ran three times and the owner</text>
<text x="492" y="896" class="t" text-anchor="start">decides, or another session holds it.</text>
<path d="M 424 869 L 438 869 L 438 937 L 480 937" class="wire-failure"/>
<path d="M 472 932 L 480 937 L 472 942 Z" class="head"/>
<rect x="480" y="914" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="932" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="950" class="t" text-anchor="start">The node is not in the intent.</text>
<path d="M 424 882 L 432 882 L 432 999 L 480 999" class="wire-refusal"/>
<path d="M 472 994 L 480 999 L 472 1004 Z" class="head"/>
<rect x="480" y="968" width="330" height="62" rx="6" class="stop-refusal"/>
<text x="492" y="986" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="1004" class="t" text-anchor="start">The node is not open, or needs a node that is</text>
<text x="492" y="1020" class="t" text-anchor="start">not done.</text>
<path d="M 64 895 L 64 1056" class="wire"/>
<path d="M 59 1048 L 64 1056 L 69 1048 Z" class="head"/>
<rect x="24" y="1056" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="1075" r="8" class="badge"/>
<text x="44" y="1079" class="badge-t" text-anchor="middle">8</text>
<text x="64" y="1078" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="1098" class="t" text-anchor="start">Print the brief.</text>
<path d="M 424 1087 L 480 1087" class="wire-end"/>
<path d="M 472 1082 L 480 1087 L 472 1092 Z" class="head"/>
<rect x="480" y="1056" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="1074" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="1092" class="t" text-anchor="start">Node &lt;id&gt; is claimed.</text>
<text x="492" y="1108" class="t" text-anchor="start">next: plastic node done &lt;intent id&gt; &lt;id&gt; TEXT</text>
<rect x="24" y="1148" width="14" height="14" rx="3" class="lane-code"/>
<text x="44" y="1160" class="k" text-anchor="start">Code Workflow</text>
<rect x="140" y="1148" width="14" height="14" rx="3" class="stop-failure"/>
<text x="160" y="1160" class="k" text-anchor="start">Stops with a failure</text>
<rect x="276" y="1148" width="14" height="14" rx="3" class="stop-refusal"/>
<text x="296" y="1160" class="k" text-anchor="start">Stops for the owner</text>
<rect x="414" y="1148" width="14" height="14" rx="3" class="stop-end"/>
<text x="434" y="1160" class="k" text-anchor="start">Ends</text>
</svg>