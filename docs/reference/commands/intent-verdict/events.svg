<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 1005" width="834" height="1005" role="img" xml:space="preserve">
<title>The events of one call of plastic intent verdict, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic intent verdict, from top to bottom</text>
<rect x="24" y="64" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="83" r="8" class="badge"/>
<text x="44" y="87" class="badge-t" text-anchor="middle">1</text>
<text x="64" y="86" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="106" class="t" text-anchor="start">Check the intent.</text>
<path d="M 424 76 L 438 76 L 438 87 L 480 87" class="wire-failure"/>
<path d="M 472 82 L 480 87 L 472 92 Z" class="head"/>
<rect x="480" y="64" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="82" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="100" class="t" text-anchor="start">No intent &lt;intent id&gt; in this store.</text>
<path d="M 424 90 L 432 90 L 432 141 L 480 141" class="wire-refusal"/>
<path d="M 472 136 L 480 141 L 472 146 Z" class="head"/>
<rect x="480" y="118" width="330" height="46" rx="6" class="stop-refusal"/>
<text x="492" y="136" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="154" class="t" text-anchor="start">The intent is done or abandoned.</text>
<path d="M 64 115 L 64 190" class="wire"/>
<path d="M 59 182 L 64 190 L 69 182 Z" class="head"/>
<rect x="24" y="190" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="209" r="8" class="badge"/>
<text x="44" y="213" class="badge-t" text-anchor="middle">2</text>
<text x="64" y="212" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="232" class="t" text-anchor="start">Check the delivery behind an accept.</text>
<path d="M 424 202 L 450 202 L 450 229 L 480 229" class="wire-failure"/>
<path d="M 472 224 L 480 229 L 472 234 Z" class="head"/>
<rect x="480" y="190" width="330" height="78" rx="6" class="stop-failure"/>
<text x="492" y="208" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="226" class="t" text-anchor="start">The spec needs a done criterion before an</text>
<text x="492" y="242" class="t" text-anchor="start">accept.</text>
<text x="492" y="258" class="t" text-anchor="start">next: plastic intent spec &lt;intent id&gt;</text>
<path d="M 424 211 L 444 211 L 444 315 L 480 315" class="wire-failure"/>
<path d="M 472 310 L 480 315 L 472 320 Z" class="head"/>
<rect x="480" y="276" width="330" height="78" rx="6" class="stop-failure"/>
<text x="492" y="294" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="312" class="t" text-anchor="start">An accept needs a node that is done.</text>
<text x="492" y="328" class="t" text-anchor="start">next: plastic node add &lt;intent id&gt; TITLE</text>
<text x="492" y="344" class="t" text-anchor="start">--criterion KEY</text>
<path d="M 424 220 L 438 220 L 438 393 L 480 393" class="wire-failure"/>
<path d="M 472 388 L 480 393 L 472 398 Z" class="head"/>
<rect x="480" y="362" width="330" height="62" rx="6" class="stop-failure"/>
<text x="492" y="380" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="398" class="t" text-anchor="start">An accept needs every node done.</text>
<text x="492" y="414" class="t" text-anchor="start">next: plastic graph show &lt;intent id&gt;</text>
<path d="M 424 229 L 432 229 L 432 487 L 480 487" class="wire-refusal"/>
<path d="M 472 482 L 480 487 L 472 492 Z" class="head"/>
<rect x="480" y="432" width="330" height="110" rx="6" class="stop-refusal"/>
<text x="492" y="450" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="468" class="t" text-anchor="start">The judge&#39;s review round of intent &lt;intent id&gt;</text>
<text x="492" y="484" class="t" text-anchor="start">is used; the owner decides between abandoning</text>
<text x="492" y="500" class="t" text-anchor="start">the intent, a follow-up intent and one more</text>
<text x="492" y="516" class="t" text-anchor="start">round: plastic intent grant &lt;intent id&gt; REASON</text>
<text x="492" y="532" class="t" text-anchor="start">--owner.</text>
<path d="M 64 241 L 64 568" class="wire"/>
<path d="M 59 560 L 64 568 L 69 560 Z" class="head"/>
<rect x="24" y="568" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="587" r="8" class="badge"/>
<text x="44" y="591" class="badge-t" text-anchor="middle">3</text>
<text x="64" y="590" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="610" class="t" text-anchor="start">Count the rounds written so far.</text>
<path d="M 64 619 L 64 645" class="wire"/>
<path d="M 59 637 L 64 645 L 69 637 Z" class="head"/>
<rect x="24" y="645" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="664" r="8" class="badge"/>
<text x="44" y="668" class="badge-t" text-anchor="middle">4</text>
<text x="64" y="667" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="687" class="t" text-anchor="start">Write the verdict.</text>
<path d="M 424 657 L 444 657 L 444 700 L 480 700" class="wire-refusal"/>
<path d="M 472 695 L 480 700 L 472 705 Z" class="head"/>
<rect x="480" y="645" width="330" height="110" rx="6" class="stop-refusal"/>
<text x="492" y="663" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="681" class="t" text-anchor="start">The judge&#39;s review round of intent &lt;intent id&gt;</text>
<text x="492" y="697" class="t" text-anchor="start">is used; the owner decides between abandoning</text>
<text x="492" y="713" class="t" text-anchor="start">the intent, a follow-up intent and one more</text>
<text x="492" y="729" class="t" text-anchor="start">round: plastic intent grant &lt;intent id&gt; REASON</text>
<text x="492" y="745" class="t" text-anchor="start">--owner.</text>
<path d="M 424 670 L 438 670 L 438 810 L 480 810" class="wire-end"/>
<path d="M 472 805 L 480 810 L 472 815 Z" class="head"/>
<rect x="480" y="763" width="330" height="94" rx="6" class="stop-end"/>
<text x="492" y="781" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="799" class="t" text-anchor="start">The judge asked for a revision; add a node</text>
<text x="492" y="815" class="t" text-anchor="start">that fixes it.</text>
<text x="492" y="831" class="t" text-anchor="start">next: plastic node add &lt;intent id&gt; TITLE</text>
<text x="492" y="847" class="t" text-anchor="start">--criterion KEY</text>
<path d="M 424 683 L 432 683 L 432 896 L 480 896" class="wire-end"/>
<path d="M 472 891 L 480 896 L 472 901 Z" class="head"/>
<rect x="480" y="865" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="883" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="901" class="t" text-anchor="start">Intent &lt;intent id&gt; is accepted.</text>
<text x="492" y="917" class="t" text-anchor="start">next: plastic intent end &lt;intent id&gt;</text>
<rect x="24" y="957" width="14" height="14" rx="3" class="lane-code"/>
<text x="44" y="969" class="k" text-anchor="start">Code Workflow</text>
<rect x="140" y="957" width="14" height="14" rx="3" class="stop-failure"/>
<text x="160" y="969" class="k" text-anchor="start">Stops with a failure</text>
<rect x="276" y="957" width="14" height="14" rx="3" class="stop-refusal"/>
<text x="296" y="969" class="k" text-anchor="start">Stops for the owner</text>
<rect x="414" y="957" width="14" height="14" rx="3" class="stop-end"/>
<text x="434" y="969" class="k" text-anchor="start">Ends</text>
</svg>