<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" xml:space="preserve">
<title>How PreviewRollback runs in plastic rollback</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="16" y="22" class="tb" text-anchor="start">PreviewRollback</text>
<text x="436" y="22" class="tm tag-muted" text-anchor="end">preview_rollback.rb:10</text>
<rect x="16" y="34" width="420" height="45" rx="6" class="card"/>
<text x="26" y="49" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="49" class="tm tag-muted" text-anchor="end">preview_rollback.rb:15</text>
<text x="26" y="66" class="t" text-anchor="start">read the activated releases</text>
<path d="M 226 79 L 226 89" class="wire"/>
<path d="M 221 81 L 226 89 L 231 81 Z" class="head"/>
<rect x="16" y="89" width="420" height="70" rx="6" class="card"/>
<text x="26" y="104" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="104" class="tm tag-muted" text-anchor="end">preview_rollback.rb:22</text>
<text x="26" y="121" class="tm" text-anchor="start">passes when context.active</text>
<path d="M 436 107 L 464 107" class="wire-refusal"/>
<path d="M 456 102 L 464 107 L 456 112 Z" class="head"/>
<rect x="466" y="89" width="270" height="70" rx="6" class="stop-refusal"/>
<text x="476" y="104" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="120" class="tm" text-anchor="start">no release is installed under</text>
<text x="476" y="134" class="tm" text-anchor="start">this home; install one with</text>
<text x="476" y="148" class="tm" text-anchor="start">install.sh first</text>
<path d="M 226 159 L 226 169" class="wire"/>
<path d="M 221 161 L 226 169 L 231 161 Z" class="head"/>
<rect x="16" y="169" width="420" height="60" rx="6" class="card"/>
<text x="26" y="184" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="184" class="tm tag-muted" text-anchor="end">preview_rollback.rb:24</text>
<text x="26" y="201" class="tm" text-anchor="start">passes when context.target.nil? ||</text>
<text x="26" y="216" class="tm" text-anchor="start">context.releases.include?(context.target)</text>
<path d="M 436 187 L 464 187" class="wire-refusal"/>
<path d="M 456 182 L 464 187 L 456 192 Z" class="head"/>
<rect x="466" y="169" width="270" height="42" rx="6" class="stop-refusal"/>
<text x="476" y="184" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="200" class="tm" text-anchor="start">%{target} is not installed</text>
<path d="M 226 229 L 226 239" class="wire"/>
<path d="M 221 231 L 226 239 L 231 231 Z" class="head"/>
<rect x="16" y="239" width="420" height="56" rx="6" class="card"/>
<text x="26" y="254" class="tag tag-muted" text-anchor="start">GATE</text>
<text x="426" y="254" class="tm tag-muted" text-anchor="end">preview_rollback.rb:26</text>
<text x="26" y="271" class="tm" text-anchor="start">passes when context.to</text>
<path d="M 436 257 L 464 257" class="wire-refusal"/>
<path d="M 456 252 L 464 257 L 456 262 Z" class="head"/>
<rect x="466" y="239" width="270" height="56" rx="6" class="stop-refusal"/>
<text x="476" y="254" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3, REFUSED</text>
<text x="476" y="270" class="tm" text-anchor="start">no previous release to go back</text>
<text x="476" y="284" class="tm" text-anchor="start">to</text>
<path d="M 226 295 L 226 305" class="wire"/>
<path d="M 221 297 L 226 305 L 231 297 Z" class="head"/>
<rect x="16" y="305" width="420" height="45" rx="6" class="card"/>
<text x="26" y="320" class="tag tag-muted" text-anchor="start">READ</text>
<text x="426" y="320" class="tm tag-muted" text-anchor="end">preview_rollback.rb:28</text>
<text x="26" y="337" class="t" text-anchor="start">say what the rollback would do</text>
<path d="M 226 350 L 226 360" class="wire"/>
<path d="M 221 352 L 226 360 L 231 352 Z" class="head"/>
<text x="16" y="372" class="tag tag-muted" text-anchor="start">ENDS ON</text>
<rect x="16" y="380" width="300" height="56" rx="6" class="card"/>
<text x="26" y="396" class="tm" text-anchor="start">:done</text>
<text x="26" y="412" class="tm tag-muted" text-anchor="start">when context.dry_run</text>
<path d="M 316 396 L 352 396" class="wire"/>
<path d="M 344 391 L 352 396 L 344 401 Z" class="head"/>
<rect x="352" y="380" width="392" height="56" rx="6" class="end"/>
<text x="362" y="397" class="t" text-anchor="start">the call finishes, exit 0</text>
<text x="362" y="411" class="t" text-anchor="start">next: %{original_command}</text>
<text x="362" y="425" class="t" text-anchor="start">because: the preview changed no file</text>
<rect x="16" y="444" width="300" height="42" rx="6" class="card"/>
<text x="26" y="460" class="tm" text-anchor="start">:continue</text>
<text x="26" y="476" class="tm tag-muted" text-anchor="start">otherwise</text>
<path d="M 316 460 L 352 460" class="wire"/>
<path d="M 344 455 L 352 460 L 344 465 Z" class="head"/>
<rect x="352" y="444" width="392" height="42" rx="6" class="lane-code"/>
<text x="362" y="461" class="t" text-anchor="start">next workflow: RollbackRelease</text>
</svg>