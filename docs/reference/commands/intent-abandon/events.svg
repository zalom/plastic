<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 935" width="834" height="935" role="img" xml:space="preserve">
<title>The events of one call of plastic intent abandon, in words</title>
<style>.ground { fill: #e9e5dc; }
.card { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.lane-code { fill: #d5e8e3; stroke: #0d6b61; stroke-width: 1.5; }
.lane-agent { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.5; }
.stop-refusal { fill: #e4dcf5; stroke: #5b35b0; stroke-width: 1.2; }
.stop-failure { fill: #f4d9d4; stroke: #a8261b; stroke-width: 1.2; }
.end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-end { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.stop-handoff { fill: #f1e2c7; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #9a5508; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #2c4a7a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #9a5508; }
.k { fill: #4f5866; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #1f2530; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #7c8594; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #7c8594; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #5b35b0; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #a8261b; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #7c8594; }
.t { fill: #1f2530; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #1f2530; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #1f2530; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #0d6b61; } .tag-agent { fill: #9a5508; } .tag-refusal { fill: #5b35b0; }
.tag-failure { fill: #a8261b; } .tag-end { fill: #2c4a7a; } .tag-muted { fill: #4f5866; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #d9e2f0; stroke: #2c4a7a; stroke-width: 1.2; }
.codebox { fill: #f4f1ea; stroke: #7c8594; stroke-width: 1; }
.cx { fill: #1f2530; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #4f5866; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #5b35b0; } .cx-s { fill: #9a5508; } .cx-y { fill: #0d6b61; }
.cx-w { fill: #2c4a7a; font-weight: 600; } .cx-t { fill: #a8261b; } .cx-c { fill: #4f5866; font-style: italic; }
.badge { fill: #2c4a7a; } .badge-t { fill: #e9e5dc; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #2c4a7a; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #7c8594; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

@media (prefers-color-scheme: dark) {
.ground { fill: #171a1f; }
.card { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.lane-code { fill: #173a36; stroke: #5cc4b4; stroke-width: 1.5; }
.lane-agent { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.5; }
.stop-refusal { fill: #2d2445; stroke: #b59cf2; stroke-width: 1.2; }
.stop-failure { fill: #45211e; stroke: #f2958a; stroke-width: 1.2; }
.end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-end { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.stop-handoff { fill: #3d2e17; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 5 3; }
.wire-handoff { fill: none; stroke: #e5a95a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-end { fill: none; stroke: #97b6e8; stroke-width: 1.2; stroke-dasharray: 4 3; }
.tag-handoff { fill: #e5a95a; }
.k { fill: #b3b9c3; font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.way { fill: #e8e4da; font: italic 12.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wire { fill: none; stroke: #8a93a2; stroke-width: 1.4; }
.wire-read { fill: none; stroke: #8a93a2; stroke-width: 1.4; stroke-dasharray: 5 3; }
.wire-refusal { fill: none; stroke: #b59cf2; stroke-width: 1.2; stroke-dasharray: 4 3; }
.wire-failure { fill: none; stroke: #f2958a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.head { fill: #8a93a2; }
.t { fill: #e8e4da; font: 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tb { fill: #e8e4da; font: 600 13px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.tm { fill: #e8e4da; font: 11.5px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.tag { font: 600 10px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
.tag-code { fill: #5cc4b4; } .tag-agent { fill: #e5a95a; } .tag-refusal { fill: #b59cf2; }
.tag-failure { fill: #f2958a; } .tag-end { fill: #97b6e8; } .tag-muted { fill: #b3b9c3; }
.tm.tag-muted { font-size: 10.5px; }
.db { fill: #1f2c42; stroke: #97b6e8; stroke-width: 1.2; }
.codebox { fill: #20242b; stroke: #8a93a2; stroke-width: 1; }
.cx { fill: #e8e4da; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
.cx-n { fill: #b3b9c3; font: 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.cx-k { fill: #b59cf2; } .cx-s { fill: #e5a95a; } .cx-y { fill: #5cc4b4; }
.cx-w { fill: #97b6e8; font-weight: 600; } .cx-t { fill: #f2958a; } .cx-c { fill: #b3b9c3; font-style: italic; }
.badge { fill: #97b6e8; } .badge-t { fill: #171a1f; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.bracket { fill: none; stroke: #97b6e8; stroke-width: 1.4; }
.term { fill: #16191e; stroke: #8a93a2; stroke-width: 1; }
.term-t { fill: #e6e2d8; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-p { fill: #8fd18f; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.term-m { fill: #a3abb6; font: 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
.big { font: 700 36px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
}</style>
<rect width="100%" height="100%" class="ground"/>
<text x="24" y="34" class="tb" text-anchor="start">One call of plastic intent abandon, from top to bottom</text>
<rect x="24" y="64" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="83" r="8" class="badge"/>
<text x="44" y="87" class="badge-t" text-anchor="middle">1</text>
<text x="64" y="86" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="106" class="t" text-anchor="start">Read the intent.</text>
<path d="M 424 76 L 438 76 L 438 87 L 480 87" class="wire-failure"/>
<path d="M 472 82 L 480 87 L 472 92 Z" class="head"/>
<rect x="480" y="64" width="330" height="46" rx="6" class="stop-failure"/>
<text x="492" y="82" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="100" class="t" text-anchor="start">No intent &lt;intent id&gt; in this store.</text>
<path d="M 424 90 L 432 90 L 432 149 L 480 149" class="wire-refusal"/>
<path d="M 472 144 L 480 149 L 472 154 Z" class="head"/>
<rect x="480" y="118" width="330" height="62" rx="6" class="stop-refusal"/>
<text x="492" y="136" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="154" class="t" text-anchor="start">Intent &lt;intent id&gt; is &lt;status&gt;; it can no</text>
<text x="492" y="170" class="t" text-anchor="start">longer be abandoned.</text>
<path d="M 64 115 L 64 206" class="wire"/>
<path d="M 59 198 L 64 206 L 69 198 Z" class="head"/>
<rect x="24" y="206" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="225" r="8" class="badge"/>
<text x="44" y="229" class="badge-t" text-anchor="middle">2</text>
<text x="64" y="228" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="248" class="t" text-anchor="start">Check delivery ownership.</text>
<path d="M 424 237 L 480 237" class="wire-refusal"/>
<path d="M 472 232 L 480 237 L 472 242 Z" class="head"/>
<rect x="480" y="206" width="330" height="62" rx="6" class="stop-refusal"/>
<text x="492" y="224" class="tag tag-refusal" text-anchor="start">STOPS, EXIT 3</text>
<text x="492" y="242" class="t" text-anchor="start">Another live session holds a node claim of the</text>
<text x="492" y="258" class="t" text-anchor="start">intent.</text>
<path d="M 64 257 L 64 294" class="wire"/>
<path d="M 59 286 L 64 294 L 69 286 Z" class="head"/>
<rect x="24" y="294" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="313" r="8" class="badge"/>
<text x="44" y="317" class="badge-t" text-anchor="middle">3</text>
<text x="64" y="316" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="336" class="t" text-anchor="start">Check the outcome.</text>
<path d="M 424 325 L 480 325" class="wire-failure"/>
<path d="M 472 320 L 480 325 L 472 330 Z" class="head"/>
<rect x="480" y="294" width="330" height="62" rx="6" class="stop-failure"/>
<text x="492" y="312" class="tag tag-failure" text-anchor="start">STOPS, EXIT 1</text>
<text x="492" y="330" class="t" text-anchor="start">Outcome.md lacks its summary or the abandon</text>
<text x="492" y="346" class="t" text-anchor="start">reason.</text>
<text x="24" y="390" class="way" text-anchor="start">When the work of the intent is not reverted yet:</text>
<rect x="24" y="402" width="400" height="51" rx="6" class="lane-agent"/>
<circle cx="44" cy="421" r="8" class="badge"/>
<text x="44" y="425" class="badge-t" text-anchor="middle">4</text>
<text x="64" y="424" class="tag tag-agent" text-anchor="start">Agent Workflow</text>
<text x="64" y="444" class="t" text-anchor="start">Revert what intent &lt;intent id&gt; changed.</text>
<path d="M 64 453 L 64 479" class="wire"/>
<path d="M 59 471 L 64 479 L 69 471 Z" class="head"/>
<rect x="24" y="479" width="400" height="51" rx="6" class="lane-agent"/>
<circle cx="44" cy="498" r="8" class="badge"/>
<text x="44" y="502" class="badge-t" text-anchor="middle">5</text>
<text x="64" y="501" class="tag tag-agent" text-anchor="start">Agent Workflow</text>
<text x="64" y="521" class="t" text-anchor="start">Record the revert.</text>
<path d="M 424 491 L 438 491 L 438 510 L 480 510" class="wire-end"/>
<path d="M 472 505 L 480 510 L 472 515 Z" class="head"/>
<rect x="480" y="479" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="497" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="515" class="t" text-anchor="start">The agent reverts the intent&#39;s changes and</text>
<text x="492" y="531" class="t" text-anchor="start">records it in outcome.md.</text>
<path d="M 424 505 L 432 505 L 432 572 L 480 572" class="wire-end"/>
<path d="M 472 567 L 480 572 L 472 577 Z" class="head"/>
<rect x="480" y="549" width="330" height="46" rx="6" class="stop-end"/>
<text x="492" y="567" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="585" class="t" text-anchor="start">The revert is recorded.</text>
<text x="24" y="629" class="way" text-anchor="start">When no work of the intent is left to revert, so the intent can be marked abandoned:</text>
<rect x="24" y="641" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="660" r="8" class="badge"/>
<text x="44" y="664" class="badge-t" text-anchor="middle">6</text>
<text x="64" y="663" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="683" class="t" text-anchor="start">Forget the abandon of an earlier call.</text>
<path d="M 64 692 L 64 718" class="wire"/>
<path d="M 59 710 L 64 718 L 69 710 Z" class="head"/>
<rect x="24" y="718" width="400" height="51" rx="6" class="lane-code"/>
<circle cx="44" cy="737" r="8" class="badge"/>
<text x="44" y="741" class="badge-t" text-anchor="middle">7</text>
<text x="64" y="740" class="tag tag-code" text-anchor="start">Code Workflow</text>
<text x="64" y="760" class="t" text-anchor="start">Abandon the intent.</text>
<path d="M 64 769 L 64 795" class="wire"/>
<path d="M 59 787 L 64 795 L 69 787 Z" class="head"/>
<rect x="24" y="795" width="400" height="51" rx="6" class="lane-agent"/>
<circle cx="44" cy="814" r="8" class="badge"/>
<text x="44" y="818" class="badge-t" text-anchor="middle">8</text>
<text x="64" y="817" class="tag tag-agent" text-anchor="start">Agent Workflow</text>
<text x="64" y="837" class="t" text-anchor="start">Stop what intent &lt;intent id&gt; started.</text>
<path d="M 424 826 L 480 826" class="wire-end"/>
<path d="M 472 821 L 480 826 L 472 831 Z" class="head"/>
<rect x="480" y="795" width="330" height="62" rx="6" class="stop-end"/>
<text x="492" y="813" class="tag tag-end" text-anchor="start">ENDS, EXIT 0</text>
<text x="492" y="831" class="t" text-anchor="start">The agent stops the processes and agents the</text>
<text x="492" y="847" class="t" text-anchor="start">intent started.</text>
<rect x="24" y="887" width="14" height="14" rx="3" class="lane-code"/>
<text x="44" y="899" class="k" text-anchor="start">Code Workflow</text>
<rect x="140" y="887" width="14" height="14" rx="3" class="lane-agent"/>
<text x="160" y="899" class="k" text-anchor="start">Agent Workflow</text>
<rect x="259" y="887" width="14" height="14" rx="3" class="stop-failure"/>
<text x="279" y="899" class="k" text-anchor="start">Stops with a failure</text>
<rect x="395" y="887" width="14" height="14" rx="3" class="stop-refusal"/>
<text x="415" y="899" class="k" text-anchor="start">Stops for the owner</text>
<rect x="533" y="887" width="14" height="14" rx="3" class="stop-end"/>
<text x="553" y="899" class="k" text-anchor="start">Ends</text>
</svg>