# Reek reads this file. The detectors run at Reek's own defaults on every Ruby
# file outside test/. The exclude lists below were generated on 2026-09-30 with
# `reek --todo` over the code written before that date, so those smells stay
# hidden. The lists never gain an entry: a new or changed method that smells
# is fixed, never listed. scripts/lib/plastic/ has no entry and stays clean.
---
exclude_paths:
  - test
  - tmp
  - coverage
detectors:
  Attribute:
    exclude:
    - Plastic::CLI::Output#project
  BooleanParameter:
    exclude:
    - Install#run
    - Doctor#check
    - InstallerCore#generate_codex_agents
    - InstallerCore#install_agents
    - InstallerCore#install_claude
    - InstallerCore#install_for_agent
    - InstallerCore#statusline_choice
    - InstallerCore#transactional_install_for_agent
    - Lock#release
    - Plastic::CLI::Output#flush
    - Plastic::CLI::Output#initialize
    - Plastic::CLI::Legacy#initialize
  ControlParameter:
    exclude:
    - Install#print_results
    - Install#run
    - Preflight#git_issue
    - Preflight#sqlite3_issue
    - InstallerCore#distribute
