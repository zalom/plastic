name: test

on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha, 'plastic/**']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install the test gems
        run: bundle install
      - name: Check install.sh with shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - name: Make an empty home for the suite
        run: mkdir -p "$RUNNER_TEMP/suite-home"
      - name: Run the full suite
        env:
          HOME: ${{ runner.temp }}/suite-home
        run: ruby bin/test
      - name: Run the acceptance documents
        env:
          HOME: ${{ runner.temp }}/suite-home
        run: ruby bin/test --system
      - name: Check that the suite wrote nothing into the home
        run: |
          written=$(find "$RUNNER_TEMP/suite-home" -mindepth 1)
          if [ -n "$written" ]; then
            echo "the suite wrote into the empty home:"
            echo "$written"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the packaged executable
        run: |
          package_dir=$(mktemp -d)
          archive=$(npm pack --silent --pack-destination "$package_dir")
          tar -xzf "$package_dir/$archive" -C "$package_dir"
          PLASTIC_ACCEPTANCE_BIN="$package_dir/package/bin/plastic" ruby bin/test --only test/cli/release_contract_test.rb

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install, update, roll back and uninstall Plastic on an empty home
        run: ruby tools/check-fresh-install
