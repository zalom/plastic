name: test

on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha, 'plastic/**']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install the test gems
        run: bundle install
      - name: Check install.sh with shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - name: Make an empty home for the suite
        run: mkdir -p "$RUNNER_TEMP/suite-home"
      - name: Run the full suite
        env:
          HOME: ${{ runner.temp }}/suite-home
        run: ruby bin/test
      - name: Run the acceptance documents
        env:
          HOME: ${{ runner.temp }}/suite-home
        run: ruby bin/test --system
      - name: Check that the suite wrote nothing into the home
        run: |
          written=$(find "$RUNNER_TEMP/suite-home" -mindepth 1)
          if [ -n "$written" ]; then
            echo "the suite wrote into the empty home:"
            echo "$written"
            exit 1
          fi
      - name: Verify the packaged executable
        run: |
          release=$(mktemp -d)
          ruby scripts/build-release --version "$(ruby -rjson -e 'print JSON.parse(File.read("package.json")).fetch("version")')" --directory "$release"
          tar -xzf "$release/plastic.tgz" -C "$release"
          PLASTIC_ACCEPTANCE_BIN="$release/package/bin/plastic" ruby bin/test --only test/cli/release_contract_test.rb

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install, update, roll back and uninstall Plastic on an empty home with no Ruby on PATH
        run: ruby tools/check-fresh-install
