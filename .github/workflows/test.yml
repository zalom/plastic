name: test

on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Run the full suite
        run: ruby bin/test
