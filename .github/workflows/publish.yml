name: publish

on:
  push:
    branches: [alpha, beta, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unreleased:
    name: Is this version unreleased
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Name the tag when it does not exist yet
        id: version
        run: |
          tag="v$(ruby -rjson -e 'puts JSON.parse(File.read("package.json")).fetch("version")')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released, nothing to publish"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Make the tag and the GitHub release
    needs: unreleased
    if: needs.unreleased.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Install the test gems
        run: bundle install

      - name: Run the full suite
        run: ruby bin/test

      - name: Guard the branch and the version file
        id: guard
        env:
          BRANCH: ${{ github.ref_name }}
        run: ruby scripts/release-check --branch "$BRANCH" --github-output "$GITHUB_OUTPUT"

      - name: Build the release files
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: ruby scripts/build-release --version "$VERSION" --directory release

      - name: Install, update, roll back and uninstall the built files on an empty home
        run: ruby tools/check-fresh-install --release release

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.guard.outputs.tag }}
          STABLE: ${{ steps.guard.outputs.channel == 'latest' }}
        run: |
          if [ "$STABLE" = "true" ]; then kind="--latest"; else kind="--prerelease"; fi
          gh release create "$TAG" release/plastic.tgz release/plastic.tgz.sha256 release/plastic.manifest.json --target "$GITHUB_SHA" --generate-notes "$kind"
