name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, for example v2.0.0-alpha.19'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install an npm that speaks OIDC
        run: npm install -g npm@latest

      - name: Guard the tag, the version files, and the npm floor
        id: guard
        run: >
          ruby scripts/release-check
          --tag "${{ inputs.tag || github.ref_name }}"
          --npm-version "$(npm --version)"
          --github-output "$GITHUB_OUTPUT"

      - name: Run the full suite
        run: ruby bin/test

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.guard.outputs.dist_tag }}"
