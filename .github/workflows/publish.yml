name: publish

on:
  push:
    branches: [alpha, beta, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unreleased:
    name: Is this version unreleased
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Name the tag when it does not exist yet
        id: version
        run: |
          tag="v$(ruby -rjson -e 'puts JSON.parse(File.read("package.json")).fetch("version")')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released, nothing to publish"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: unreleased
    if: needs.unreleased.outputs.tag != ''
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@zalom/plastic
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install an npm that speaks OIDC
        run: npm install -g npm@latest

      - name: Install the test gems
        run: bundle install

      - name: Run the full suite
        run: ruby bin/test

      - name: Guard the branch, the version files, and the npm floor
        id: guard
        env:
          BRANCH: ${{ github.ref_name }}
        run: >
          ruby scripts/release-check
          --branch "$BRANCH"
          --npm-version "$(npm --version)"
          --github-output "$GITHUB_OUTPUT"

      - name: Build the archive
        run: npm pack && mv zalom-plastic-*.tgz plastic.tgz

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.guard.outputs.tag }}
          STABLE: ${{ steps.guard.outputs.dist_tag == 'latest' }}
        run: |
          if [ "$STABLE" = "true" ]; then kind="--latest"; else kind="--prerelease"; fi
          gh release create "$TAG" plastic.tgz --target "$GITHUB_SHA" --generate-notes "$kind"

      - name: Publish to npm
        run: npm publish plastic.tgz --provenance --access public --tag "${{ steps.guard.outputs.dist_tag }}"
